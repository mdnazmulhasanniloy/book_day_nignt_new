name: CI

# Tests only. This workflow never deploys, never reads a repository secret and never
# talks to staging or production. It lives at the repository root because GitHub
# ignores .github/ folders inside sub-directories of a monorepo.
on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Placeholder values only (public, throwaway). They satisfy the required-env checks
# of the server, worker and scheduler; nothing connects to S3, Stripe, Redis,
# Firebase or SMTP (tests use fakes).
env:
  NODE_ENV: test
  SERVER_URL: http://localhost:5000
  REDIS_HOST: localhost
  REDIS_PASSWORD: ci-dummy
  REDIS_PORT: '6379'
  PORT: '5000'
  JWT_ACCESS_TOKEN_SECRET_KEY: ci-dummy-access-secret
  JWT_REFRESH_TOKEN_SECRET_KEY: ci-dummy-refresh-secret
  JWT_VERIFY_OTP_PAGE_SECRET_KEY: ci-dummy-otp-page-secret
  JWT_RESET_PASSWORD_TOKEN_SECRET_KEY: ci-dummy-reset-secret
  OTP_HASH_SECRET: ci-dummy-otp-hash
  S3_ACCESS_KEY: ci-dummy
  S3_SECRET_KEY: ci-dummy
  S3_REGION: us-east-1
  S3_BUCKET_NAME: ci-dummy-bucket
  S3_ENDPOINT: http://localhost:9000
  S3_PUBLIC_URL: http://localhost:9000/ci-dummy-bucket
  STRIPE_SECRET_KEY: sk_test_ci_dummy
  STRIPE_PAYMENT_WEBHOOK_SECRET_KEY: whsec_ci_dummy
  STRIPE_CONNECT_WEBHOOK_SECRET_KEY: whsec_ci_dummy_connect
  STRIPE_CONNECT_PUBLIC_BASE_URL: http://localhost:5000
  FLUTTER_CONNECT_APP_LINK_URL: http://localhost:5000/app
  FIREBASE_ACCOUNT_TYPE: service_account
  FIREBASE_PROJECT_ID: ci-dummy
  FIREBASE_PRIVATE_KEY_ID: ci-dummy
  FIREBASE_PRIVATE_KEY: ci-dummy
  FIREBASE_CLIENT_ID: ci-dummy
  FIREBASE_AUTH_URI: http://localhost/auth
  FIREBASE_TOKEN_URI: http://localhost/token
  FIREBASE_AUTH_PROVIDER_X509_CERT_URL: http://localhost/certs
  FIREBASE_CLIENT_X509_CERT_URL: http://localhost/certs
  FIREBASE_UNIVERSE_DOMAIN: localhost
  FIREBASE_CLIENT_EMAIL: ci-dummy@example.test
  SMTP_HOST: localhost
  SMTP_PORT: '25'
  SMTP_USER: ci-dummy
  SMTP_PASS: ci-dummy

defaults:
  run:
    working-directory: backend

jobs:
  lint:
    name: Lint (server)
    runs-on: ubuntu-latest
    # Known limitation: typescript-eslint does not support TypeScript 7 yet (the build
    # scripts skip ESLint for the same reason). Until that is fixed this job reports the
    # problem without failing the run. Remove continue-on-error once lint runs again.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            backend/server/package-lock.json
      - name: Install root dependencies
        run: npm ci --legacy-peer-deps
      - name: Install server dependencies
        run: |
          cd server
          npm ci
          cp -r ../prisma ./
          npx prisma generate
      - name: ESLint
        run: |
          cd server
          npm run lint

  test:
    name: Typecheck and tests (server, worker, scheduler)
    runs-on: ubuntu-latest

    # Throwaway Postgres+PostGIS that lives only for this job. The credentials are
    # public placeholders for an ephemeral container, not secrets.
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: bookdia_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d bookdia_ci_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # The database name ends in _test; the test harness refuses any other name.
      DATABASE_URL: postgresql://ci_user:ci_password@localhost:5432/bookdia_ci_test?schema=public
      TEST_DATABASE_URL: postgresql://ci_user:ci_password@localhost:5432/bookdia_ci_test?schema=public

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            backend/server/package-lock.json
            backend/worker/package-lock.json
            backend/scheduler/package-lock.json

      - name: Install root dependencies (prisma CLI)
        run: npm ci --legacy-peer-deps

      - name: Apply migrations to the throwaway test database
        run: npx prisma migrate deploy

      - name: Install dependencies and generate the Prisma client (all three services)
        run: |
          for svc in server worker scheduler; do
            (cd "$svc" && npm ci && cp -r ../prisma ./ && npx prisma generate)
          done

      - name: Typecheck
        run: |
          for svc in server worker scheduler; do
            echo "== tsc $svc"
            (cd "$svc" && npx tsc --noEmit -p .)
          done

      - name: Server unit tests (no database)
        run: |
          cd server
          env -u TEST_DATABASE_URL npm test

      - name: Server database tests
        run: |
          cd server
          npm run test:db

      - name: Worker tests (database-backed)
        run: |
          cd worker
          npm test

      - name: Scheduler tests
        run: |
          cd scheduler
          npm test
