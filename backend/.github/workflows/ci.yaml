name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Placeholder values only: CI never receives real credentials and never talks to
# staging or production. Every variable below is a dummy that satisfies the
# server's required-env check (server/src/env.ts); nothing connects to S3,
# Stripe or Redis (tests use fakes).
env:
  NODE_ENV: test
  SERVER_URL: http://localhost:5000
  REDIS_HOST: localhost
  REDIS_PASSWORD: ci-dummy
  REDIS_PORT: '6379'
  PORT: '5000'
  JWT_ACCESS_TOKEN_SECRET_KEY: ci-dummy-access-secret
  JWT_REFRESH_TOKEN_SECRET_KEY: ci-dummy-refresh-secret
  JWT_VERIFY_OTP_PAGE_SECRET_KEY: ci-dummy-otp-page-secret
  JWT_RESET_PASSWORD_TOKEN_SECRET_KEY: ci-dummy-reset-secret
  OTP_HASH_SECRET: ci-dummy-otp-hash
  S3_ACCESS_KEY: ci-dummy
  S3_SECRET_KEY: ci-dummy
  S3_REGION: us-east-1
  S3_BUCKET_NAME: ci-dummy-bucket
  S3_ENDPOINT: http://localhost:9000
  S3_PUBLIC_URL: http://localhost:9000/ci-dummy-bucket
  STRIPE_SECRET_KEY: sk_test_ci_dummy
  STRIPE_PAYMENT_WEBHOOK_SECRET_KEY: whsec_ci_dummy
  STRIPE_CONNECT_WEBHOOK_SECRET_KEY: whsec_ci_dummy_connect
  STRIPE_CONNECT_PUBLIC_BASE_URL: http://localhost:5000
  FLUTTER_CONNECT_APP_LINK_URL: http://localhost:5000/app

jobs:
  integration:
    name: Build & Test
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy?schema=public"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Root Dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Scheduler Service
        run: |
          cd scheduler
          npm install
          cp -r ../prisma ./
          npx prisma generate
          npm run build

      - name: Build Worker Service
        run: |
          cd worker
          npm install
          cp -r ../prisma ./
          npx prisma generate
          npm run build

      - name: Build Server Service
        run: |
          cd server
          npm install
          cp -r ../prisma ./
          npx prisma generate
          npm run build

  server-tests:
    name: Server unit and database tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    # Throwaway Postgres+PostGIS that lives only for this job. The credentials
    # are public placeholders for an ephemeral container, not secrets.
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: bookdia_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d bookdia_ci_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # The database name ends in _test; the harness refuses any other name.
      DATABASE_URL: postgresql://ci_user:ci_password@localhost:5432/bookdia_ci_test?schema=public
      TEST_DATABASE_URL: postgresql://ci_user:ci_password@localhost:5432/bookdia_ci_test?schema=public

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Root Dependencies (prisma CLI)
        run: npm ci --legacy-peer-deps

      - name: Apply migrations to the throwaway test database
        run: npx prisma migrate deploy

      - name: Install Server Dependencies
        run: |
          cd server
          npm ci || npm install
          cp -r ../prisma ./
          npx prisma generate

      - name: Server unit tests (no database)
        run: |
          cd server
          env -u TEST_DATABASE_URL npm test

      - name: Server database tests
        run: |
          cd server
          npm run test:db
