services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: bookdianight-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: bookdianight
    volumes:
      - bookdianight-postgres-volume:/var/lib/postgresql/data
    networks:
      - bookdianight-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: bookdianight-redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - bookdianight-redis-volume:/data
    networks:
      - bookdianight-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  db-migrator:
    image: bookdianight-server:vps-deploy
    container_name: bookdianight-db-migrator
    env_file: .env
    command: ["npx", "prisma", "migrate", "deploy"]
    networks:
      - bookdianight-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"

  scheduler:
    image: bookdianight-scheduler:vps-deploy
    container_name: bookdianight-scheduler
    env_file: .env
    networks:
      - bookdianight-network
    depends_on:
      db-migrator:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pidof node > /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  worker:
    image: bookdianight-worker:vps-deploy
    container_name: bookdianight-worker
    env_file: .env
    networks:
      - bookdianight-network
    depends_on:
      db-migrator:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pidof node > /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  server:
    image: bookdianight-server:vps-deploy
    container_name: bookdianight-server
    env_file: .env
    ports:
      - "5000:5000"
    networks:
      - bookdianight-network
    depends_on:
      db-migrator:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 25s
    restart: unless-stopped

  admin:
    image: bookdianight-admin:vps-deploy
    container_name: bookdianight-admin
    ports:
      - "3001:80"
    networks:
      - bookdianight-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

networks:
  bookdianight-network:
    driver: bridge

volumes:
  bookdianight-postgres-volume:
  bookdianight-redis-volume:
