  /api/v1/event/{eventId}/guest-list/join:
    post:
      operationId: postEventEventIdGuestListJoin
      tags:
        - Guest List
      summary: Join an event's guest list
      description: 'Any authenticated user (the controller tolerates a missing user, but the route requires a token). Entry is created PENDING with userId = caller. Service checks: event exists & active (404); guestList enabled (409 ''Guest list is closed''); computeIsOpen = enabled, before cutoffAt, after (startAt - daysBefore days), and freeSpots not exhausted (409 ''Guest list is closed or full''); arrivalTime must be in arrivalTimes when owner configured any (422); party size <= remaining total (409), men <= remaining male cap (409), women <= remaining female cap (409). Duplicate check (T-020, BUG-B29): a user with a PENDING or CONFIRMED entry (CONFIRMED is the approved state in the schema) for the same event gets 409 GUEST_LIST_DUPLICATE; a REJECTED entry does not block a new request. Check and insert run in one transaction under a pg_advisory_xact_lock on user and event, so parallel identical joins create one row. Body .strict; at least one guest required (422 on menCount).'
      security:
        - bearerAuth: []
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 120
                email:
                  type: string
                  format: email
                phone:
                  type: string
                  minLength: 1
                  maxLength: 40
                menCount:
                  type: integer
                  minimum: 0
                  default: 0
                womenCount:
                  type: integer
                  minimum: 0
                  default: 0
                otherCount:
                  type: integer
                  minimum: 0
                  default: 0
                arrivalTime:
                  type: string
                  minLength: 1
                  maxLength: 80
                  default: Anytime
                  description: null/''/omitted -> 'Anytime'
                acceptedTerms:
                  type: boolean
                  enum:
                    - true
              required:
                - name
                - email
                - phone
                - acceptedTerms
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  message:
                    type: string
                    example: Joined guest list successfully
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      status:
                        type: string
                        enum:
                          - PENDING
                      menCount:
                        type: integer
                      womenCount:
                        type: integer
                      otherCount:
                        type: integer
                    required:
                      - id
                      - status
                      - menCount
                      - womenCount
                      - otherCount
                  traceId:
                    type: string
                required:
                  - success
                  - message
                  - data
                  - traceId
        '422':
          description: '- ''arrivalTime is not available for this guest list'' (service-level)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: |-
            - TOKEN_INVALID: 'Token not found' / 'Token is invalid' (missing/malformed Bearer header or bad JWT)
            - TOKEN_EXPIRED: 'Token has been expired'
            - TOKEN_BLACKLISTED: 'Token has been revoked'
            - ACCOUNT_DELETED: 'Your account has been deleted' (checkAccountStatus)
            - USER_BLOCKED: 'Your account has been blocked' (checkAccountStatus)
            - ACCOUNT_INACTIVE: 'Your account has been deactivated' (checkAccountStatus)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: |-
            - USER_NOT_FOUND: 'User not found' (JWT valid but user row no longer exists; checkUserExistenceMiddleware)
            - 'Event not found' (no errorType)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '409':
          description: '- ''Guest list is closed'' / ''Guest list is closed or full'' / ''Guest list does not have enough spots'' / ''Male guest list capacity reached'' / ''Female guest list capacity reached'' (no errorType) | GUEST_LIST_DUPLICATE: ''You already have an active request for this guest list'' (T-020)'
