  /api/v1/promo/validate:
    post:
      tags:
        - Promo
      summary: Validate Promo Code (Customer / Mobile App)
      description: '**Target Audience: Customer / Mobile App User.** Used during the checkout flow in the mobile app to validate a coupon/promo code and calculate the discount amount before paying for a club booking or event ticket. Rate limit (T-019): a fixed window of 20 requests per 60 seconds, counted per client IP and, when a valid bearer token is present, also per user id; either counter over the limit rejects the call. The rejection is 429 with a Retry-After header (seconds left in the window) and body {success:false, message, errorType:"RATE_LIMITED", traceId}; never 401 or 403. A missing, expired or garbage token is not rejected: it is limited by IP only. The limiter runs before body validation, so malformed requests also count. A Redis failure is not failed open (500).'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - code
                - originalAmount
              properties:
                code:
                  type: string
                originalAmount:
                  type: number
                eventId:
                  type: string
                  format: uuid
                clubId:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Promo code is valid
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      isValid:
                        type: boolean
                      code:
                        type: string
                      discountType:
                        type: string
                        enum:
                          - PERCENTAGE
                          - FIXED_AMOUNT
                      discountValue:
                        type: number
                      discountAmount:
                        type: number
                      finalAmount:
                        type: number
                  traceId:
                    type: string
        '400':
          description: Promo code expired or usage limit reached
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Invalid or inactive promo code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: 'Zod validation failure from validateReq* middleware (NOTE: status is 422, not 400). Message is one of: Request body validation failed. Unknown keys on `.strict` bodies also fail. Body failures include traceId and per-issue `code`; query/params failures omit traceId. (Malformed JSON body -> 400 {success,message:''Invalid JSON Payload'',traceId} from global handler.)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '429':
          description: Too many validation attempts (errorType RATE_LIMITED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
          headers:
            Retry-After:
              description: Seconds left in the current window.
              schema:
                type: integer
      operationId: validatePromoCode

