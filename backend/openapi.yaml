        - eventName
        - thumbnail
        - images
        - lat
        - lng
        - location
        - startAt
        - endAt
        - dressCode
        - eventPrice
        - currency
      properties:
        eventName:
          type: string
        eventDescription:
          type: string
          nullable: true
          description: Optional. An empty string is stored as null.
        thumbnail:
          type: string
          format: uri
        images:
          type: array
          items:
            type: string
            format: uri
        eventStatus:
          type: string
          enum:
            - UPCOMING
            - ONGOING
            - COMPLETED
            - CANCELED
          default: UPCOMING
        lat:
          type: number
        lng:
          type: number
        location:
          type: string
        startAt:
          type: string
          format: date-time
          description: Event timestamps are expected as UTC ISO datetime values.
        endAt:
          type: string
          format: date-time
          description: Event timestamps are expected as UTC ISO datetime values. endAt must be after startAt.
        dressCode:
          type: string
        eventPrice:
          type: number
        currency:
          type: string
        categoryType:
          type: string
          enum:
            - CLUB
            - CONCERT
            - FESTIVAL
            - OPEN_AIR
            - WAREHOUSE
        musicGenres:
          type: array
          items:
            type: string
        moodTags:
          type: array
          items:
            type: string
        isResaleEnabled:
          type: boolean
        clubId:
          type: string
          description: Optional link to a club. Not verified for existence or ownership.
        timezone:
          type: string
          description: 'IANA zone of the venue, for example Europe/Paris (T-017). Validated against real IANA names (offsets, wrong case or arbitrary text return 422). Omitted on create: UTC (never inferred from city or coordinates). Omitted on update: the stored value is kept.'
        pricingMode:
          type: string
          enum:
            - SINGLE
            - TIERED
            - FREE
            - MIXED
          description: 'Which price source applies at checkout (T-017). SINGLE=eventPrice, TIERED=ticketTiers, FREE=free admission, MIXED=free plus paid tiers. Checked on write against the price and the active tiers (a section counts through its children): TIERED needs at least one tier; SINGLE needs no tiers; FREE needs eventPrice 0 and no paid tier; MIXED needs at least one free and one paid tier. A mismatch returns 422 with errorType PRICING_MODE_INVALID and changes nothing. Omitted on create: derived (TIERED if tiers exist, else FREE if eventPrice is 0, else SINGLE). Omitted on update: the stored value is kept while it still fits, otherwise it is derived.'
        ticketTiers:
          type: array
          items:
            $ref: '#/components/schemas/EventTicketTierPayload'
        lineup:
          type: array
          items:
            $ref: '#/components/schemas/EventLineupPayload'
