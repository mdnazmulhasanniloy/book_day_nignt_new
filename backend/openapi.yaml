          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
        - name: eventStatus
          in: query
          description: When supplied, only Events matching that status are returned. UPCOMING also excludes expired Events by requiring endAt to be later than the current time.
          schema:
            type: string
            enum:
              - UPCOMING
              - ONGOING
              - COMPLETED
              - CANCELED
        - name: isActive
          in: query
          description: true returns active Events only, false returns deactivated Events only. The backend safely parses "true" and "false" query strings.
          schema:
            type: boolean
            description: '''true''/''false'' string accepted (preprocessed); other values -> 422'
      responses:
