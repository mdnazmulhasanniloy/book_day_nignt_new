  /api/v1/admin/auth/refresh:
    post:
      tags:
        - Admin Auth
      summary: Refresh Admin Tokens
      description: Atomically rotates refresh tokens. Requires valid CSRF and refresh cookies. Atomically consumes the refresh session in Redis and sets new cookies. An invalid, expired, missing or already consumed refresh session returns 401 (errorType TOKEN_INVALID or TOKEN_EXPIRED), not 500 (T-010). Needs the refresh_token and admin_csrf_token cookies plus the x-csrf-token header.
      parameters:
        - name: X-CSRF-Token
          in: header
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Tokens refreshed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Admin tokens refreshed successfully
                  csrfToken:
                    type: string
                    description: CSRF token provided for easier Swagger testing. Usually sent via cookie.
                  traceId:
                    type: string
                    format: uuid
          headers:
            Set-Cookie:
              description: access_token (HttpOnly), refresh_token (HttpOnly), admin_csrf_token
              schema:
                type: string
        '401':
          description: Invalid or already consumed refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
        '403':
          description: CSRF Token Invalid or Access Denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Admin user not found (USER_NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      security:
        - adminAuth: []
          csrfAuth: []
