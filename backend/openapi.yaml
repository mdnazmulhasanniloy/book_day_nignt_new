          schema:
            type: string
            enum:
              - USER
              - CLUB_OWNER
          description: Filter by role
        - in: query
          name: search
          schema:
            type: string
          description: Search by email or name
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - ACTIVE
              - BLOCKED
              - INACTIVE
              - DELETED
      responses:
        '200':
          description: Users retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Users retrieved successfully
                  meta:
                    type: object
                  data:
                    type: array
                    items:
                      type: object
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Admin user not found (USER_NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '422':
          description: page or limit is not a positive integer, or limit above 100, or invalid status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      description: CSRF header required on this GET. Only roles USER and CLUB_OWNER are listed; the default excludes DELETED accounts, pass status=DELETED to list them. page and limit must match ^[1-9][0-9]*$ (positive integer) and limit is at most 100; anything else (abc, 0, -1, 1.5, empty, 101) returns 422 with errors[] (T-010). Defaults are 1 and 10. The response no longer contains the password hash. search matches name or email, case-insensitive.

