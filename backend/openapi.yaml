                    required:
                      - token
                      - refreshToken
                  traceId:
                    type: string
                required:
                  - success
                  - message
                  - data
        '401':
          description: Refresh token has expired (TOKEN_EXPIRED); Refresh token is invalid (TOKEN_INVALID); Session has ended. Please log in again. (TOKEN_BLACKLISTED); Session is no longer valid (TOKEN_INVALID); Session is missing a device (INVALID_DEVICE_CONTEXT)
