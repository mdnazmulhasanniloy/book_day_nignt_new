openapi: 3.0.3
info:
  title: BookDiaNight API
  version: 1.0.0
  description: API documentation for the BookDiaNight backend.
servers:
  - url: https://ibady.nazmul.qzz.io
    description: Public server
  - url: https://api.bookdianight.com
    description: Production server
tags:
  - name: Health
    description: System health and status endpoints
  - name: Auth
    description: Authentication and device management endpoints
  - name: Media
    description: Public media and file upload endpoints
  - name: Club
    description: Club management endpoints
  - name: Event
    description: Event management endpoints
  - name: Explore
    description: Public exploration endpoints
  - name: Wishlist
    description: User wishlist management endpoints
  - name: Connect
    description: Stripe Connect onboarding, callback, and webhook endpoints
  - name: Purchase
    description: Payment-ready pending Club and Event purchase creation
  - name: Payment
    description: Stripe payment initialization for pending Orders
  - name: Recover
    description: Account recovery endpoints
  - name: Admin Auth
    description: Admin authentication endpoints
  - name: Profile
    description: User profile endpoints
  - name: Admin Legal
    description: Admin legal endpoints
  - name: Public Legal
    description: Public Legal endpoints
  - name: Notification
    description: Endpoints for user push and in-app notifications
  - name: Reviews
    description: Endpoints for user reviews and ratings for Clubs
  - name: Owner
    description: Endpoints for Owner management
  - name: Bookings
    description: Endpoints for user bookings management
  - name: Webhook
    description: Endpoints for webhook management (stripe)
  - name: Waiting List
    description: Endpoints for club waiting list management
  - name: Cities
    description: City selector and city management
  - name: Artists
    description: Artist discovery, profile edit and follow endpoints

components:
  securitySchemes:
    adminAuth:
      type: apiKey
      in: cookie
      name: access_token
      description: 'Cookie based access token for Admin API.'
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'JWT Bearer token for authentication.

        Note: The `/auth/verify` and `/auth/resend` endpoints expect the
        OTP-page pending verification token,

        whereas `/auth/check` expects the standard user access token.

        '
    csrfAuth:
      type: apiKey
      in: header
      name: x-csrf-token
      description: 'Double-submit CSRF token for admin write requests: the header value must equal the admin_csrf_token cookie. Also required on admin GET /admin/dashboard, /admin/users, /admin/earnings.'
  schemas:
    CreateWishlistPayload:
      type: object
      required:
        - type
        - targetId
      properties:
        type:
          type: string
          enum:
            - CLUB
            - EVENT
        targetId:
          type: string
          format: uuid

    GetWishlistResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            meta:
              $ref: '#/components/schemas/ExplorePaginationMeta'
            data:
              type: array
              description: >
                Array of saved items. The exact shape depends on the target type.
                Stale records (deactivated Clubs, non-UPCOMING Events, deactivated Events) are excluded.
                Ordered by wishlist creation time descending.
              items:
                oneOf:
                  - $ref: '#/components/schemas/ExploreClubListItem'
                  - $ref: '#/components/schemas/ExploreEventListItem'

    ClubOpeningHourPayload:
      type: object
      required:
        - dayOfWeek
        - isClosed
        - closesNextDay
      properties:
        dayOfWeek:
          type: integer
          minimum: 0
          maximum: 6
        isClosed:
          type: boolean
        openTime:
          type: string
          format: date-time
          nullable: true
        closeTime:
          type: string
          format: date-time
          nullable: true
        closesNextDay:
          type: boolean
    ClubPackagePayload:
      type: object
      required:
        - name
        - capacity
        - price
        - currency
        - features
      properties:
        name:
          type: string
        description:
          type: string
          nullable: true
        capacity:
          type: integer
          minimum: 1
        price:
          type: number
          minimum: 0
        currency:
          type: string
        features:
          type: array
          items:
            type: string
        sortOrder:
          type: integer
          default: 0
    CreateClubPayload:
      type: object
      required:
        - name
        - thumbnail
        - images
        - dressCode
        - isRecurring
        - lat
        - lng
        - location
        - openingHours
        - packages
      properties:
        name:
          type: string
        description:
          type: string
          nullable: true
        thumbnail:
          type: string
          format: uri
        images:
          type: array
          items:
            type: string
            format: uri
        dressCode:
          type: string
        isRecurring:
          type: boolean
        isVip:
          type: boolean
          default: false
        lat:
          type: number
          minimum: -90
          maximum: 90
        lng:
          type: number
          minimum: -180
          maximum: 180
        location:
          type: string
        openingHours:
          type: array
          items:
            $ref: '#/components/schemas/ClubOpeningHourPayload'
          minItems: 7
          maxItems: 7
        packages:
          type: array
          description: List of packages. All packages within a club MUST share the exact same currency string. Mixed currencies will result in a 422 validation error.
          items:
            $ref: '#/components/schemas/ClubPackagePayload'
    UpdateClubOpeningHourPayload:
      allOf:
        - $ref: '#/components/schemas/ClubOpeningHourPayload'
        - type: object
          properties:
            id:
              type: string
              format: uuid
              description: Optional. If omitted, upsert by clubId + dayOfWeek.
    UpdateClubPackagePayload:
      allOf:
        - $ref: '#/components/schemas/ClubPackagePayload'
        - type: object
          properties:
            id:
              type: string
              format: uuid
              description: Optional. Omit to CREATE a new package on this club.
            isActive:
              type: boolean
              description: >-
                Remove rule — false removes the package (hard-delete if unused,
                else deactivate). Omitted packages in the array are left untouched.
              default: true
    UpdateClubPayload:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
          nullable: true
        thumbnail:
          type: string
          format: uri
        images:
          type: array
          items:
            type: string
            format: uri
        dressCode:
          type: string
        isRecurring:
          type: boolean
        isVip:
          type: boolean
        isActive:
          type: boolean
          description: Owner activate/deactivate. Maps to Club.deactivatedAt.
        lat:
          type: number
          minimum: -90
          maximum: 90
        lng:
          type: number
          minimum: -180
          maximum: 180
        location:
          type: string
        openingHours:
          type: array
          items:
            $ref: '#/components/schemas/UpdateClubOpeningHourPayload'
          minItems: 7
          maxItems: 7
        packages:
          type: array
          description: >-
            Current package list for upsert. No id = create; id = update;
            isActive false = remove. Omitted existing packages are kept.
            Active packages MUST share the same currency.
          items:
            $ref: '#/components/schemas/UpdateClubPackagePayload'
    ExplorePaginationMetaLinks:
      type: object
      required:
        - currentPage
        - nextPage
        - previousPage
        - firstPage
        - lastPage
      properties:
        currentPage:
          type: string
          format: uri
        nextPage:
          type: string
          format: uri
          nullable: true
        previousPage:
          type: string
          format: uri
          nullable: true
        firstPage:
          type: string
          format: uri
        lastPage:
          type: string
          format: uri
    ExplorePaginationMeta:
      type: object
      required:
        - total
        - totalPages
        - links
      properties:
        total:
          type: integer
        totalPages:
          type: integer
        links:
          $ref: '#/components/schemas/ExplorePaginationMetaLinks'
    ExploreClubListItem:
      type: object
      required:
        - id
        - name
        - lat
        - lng
        - location
        - type
        - review
        - isVip
        - thumbnail
        - priceRange
        - currency
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        lat:
          type: number
        lng:
          type: number
        location:
          type: string
        type:
          type: string
          enum:
            - CLUB
        review:
          type: number
        isVip:
          type: boolean
        thumbnail:
          type: string
          format: uri
        priceRange:
          type: object
          required:
            - minPrice
            - maxPrice
          properties:
            minPrice:
              type: number
              description: The minimum package price derived strictly from ACTIVE packages. If a club has no active packages, this fallback value is 0.
            maxPrice:
              type: number
              description: The maximum package price derived strictly from ACTIVE packages. If a club has no active packages, this fallback value is 0.
          description: Object containing the minimum and maximum package prices for the club.
        currency:
          type: string
          description: The single shared currency derived strictly from ACTIVE packages. If a club has no active packages, this fallback value is an empty string "".
        isWishlist:
          type: boolean
          description: Whether the club is saved in the authenticated user's wishlist. Omitted for guest requests.
        distanceKm:
          type: number
          description: Distance in km (1 decimal, PostGIS ST_Distance on the geography) from the search centre. Present only when a centre exists (lat+lng, or the City centre of cityId).
    ExploreEventListItem:
      type: object
      required:
        - id
        - name
        - lat
        - lng
        - location
        - type
        - thumbnail
        - price
        - currency
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        lat:
          type: number
        lng:
          type: number
        location:
          type: string
        type:
          type: string
          enum:
            - EVENT
        thumbnail:
          type: string
          format: uri
        price:
          type: number
        currency:
          type: string
        isWishlist:
          type: boolean
          description: Whether the event is saved in the authenticated user's wishlist. Omitted for guest requests.
        distanceKm:
          type: number
          description: Distance in km (1 decimal) from the search centre. Present only when a centre exists (lat+lng, or the City centre of cityId).
        startAt:
          type: string
          format: date-time
          description: Present on items returned with group=day.
    ExploreClubDetailOpeningHour:
      type: object
      properties:
        id:
          type: string
          format: uuid
        clubId:
          type: string
          format: uuid
        dayOfWeek:
          type: integer
        isClosed:
          type: boolean
        openTime:
          type: string
          format: date-time
          nullable: true
        closeTime:
          type: string
          format: date-time
          nullable: true
        closesNextDay:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ExploreClubDetailPackage:
      type: object
      properties:
        id:
          type: string
          format: uuid
        clubId:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        capacity:
          type: integer
        price:
          type: number
        currency:
          type: string
        features:
          type: array
          items:
            type: string
        sortOrder:
          type: integer
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ExploreClubDetailResponse:
      type: object
      required:
        - id
        - name
        - thumbnail
        - images
        - dressCode
        - isRecurring
        - isVip
        - lat
        - lng
        - location
        - totalReviews
        - clubOpeningHours
        - clubPackages
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        thumbnail:
          type: string
          format: uri
        images:
          type: array
          items:
            type: string
            format: uri
        dressCode:
          type: string
        isRecurring:
          type: boolean
        isVip:
          type: boolean
        lat:
          type: number
        lng:
          type: number
        location:
          type: string
        totalReviews:
          type: integer
        clubOpeningHours:
          type: array
          items:
            $ref: '#/components/schemas/ExploreClubDetailOpeningHour'
        clubPackages:
          type: array
          items:
            $ref: '#/components/schemas/ExploreClubDetailPackage'
        isWishlist:
          type: boolean
          description: Whether the club is saved in the authenticated user's wishlist. Omitted for guest requests.
    ExploreEventDetailResponse:
      type: object
      required:
        - id
        - eventName
        - thumbnail
        - images
        - eventStatus
        - lat
        - lng
        - location
        - startAt
        - endAt
        - dressCode
        - eventPrice
        - currency
      properties:
        id:
          type: string
          format: uuid
        eventName:
          type: string
        eventDescription:
          type: string
          nullable: true
        thumbnail:
          type: string
          format: uri
        images:
          type: array
          items:
            type: string
            format: uri
        eventStatus:
          type: string
        lat:
          type: number
        lng:
          type: number
        location:
          type: string
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
        dressCode:
          type: string
        eventPrice:
          type: number
        currency:
          type: string
        isWishlist:
          type: boolean
          description: Whether the event is saved in the authenticated user's wishlist. Omitted for guest requests.
        timezone:
          type: string
          description: IANA time zone of the event (default UTC; nothing is inferred from city or coordinates).
        interestedCount:
          type: integer
          description: Live count of users who tapped Interested (always present). No user identity is returned.
        isInterested:
          type: boolean
          description: Whether the caller tapped Interested. Present only with a valid bearer token.
        mapUrl:
          type: string
          description: Google Maps link https://www.google.com/maps/search/?api=1&query=<URL-encoded "<eventName> <lat>,<lng>">. Always present on type=EVENT.
        club:
          $ref: '#/components/schemas/ExploreEventClubIdentity'
    ChangePasswordPayload:
      type: object
      required:
        - currentPassword
        - newPassword
        - confirmPassword
      properties:
        currentPassword:
          type: string
          minLength: 6
        newPassword:
          type: string
          minLength: 6
        confirmPassword:
          type: string
          minLength: 6
    UpdateCommissionPayload:
      type: object
      required:
        - serviceType
        - chargePercentage
      properties:
        serviceType:
          type: string
          enum: [EVENT, CLUB]
        chargePercentage:
          type: number
          format: decimal
          multipleOf: 0.01
          description: Decimal commission percentage with up to two decimal places.
          example: 20.25
    ClubPurchaseRequest:
      type: object
      required: [clubPackageId, startAt, endAt, guestCount]
      properties:
        clubPackageId: { type: string, format: uuid }
        startAt:
          {
            type: string,
            format: date-time,
            description: Fixed CST wall-clock ISO-8601 value with required -06:00 offset.,
          }
        endAt:
          {
            type: string,
            format: date-time,
            description: Fixed CST wall-clock ISO-8601 value with required -06:00 offset.,
          }
        guestCount: { type: integer, minimum: 1 }
    ClubAvailabilityResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          required: [data]
          properties:
            message:
              type: string
              description: Empty results remain successful (HTTP 200). The message starts with "No table found" and explains whether the requested guest count exceeds the maximum active table capacity, suitable tables are unavailable for the interval, or the club has no active tables.
              example: No table found for 12 guests. Maximum table capacity is 10.
            data:
              type: object
              required: [availablePackages]
              properties:
                availablePackages:
                  type: array
                  description: Active packages that satisfy the requested guest count and interval.
                  items:
                    $ref: '#/components/schemas/ExploreClubDetailPackage'
    EventPurchaseFriend:
      type: object
      required: [name, phoneNumber, gender, age]
      properties:
        name: { type: string }
        phoneNumber: { type: string }
        gender: { type: string, enum: [MALE, FEMALE, OTHER] }
        age: { type: integer, minimum: 1 }
        image: { type: string, format: uri }
    EventPurchaseRequest:
      type: object
      required: [eventId]
      properties:
        eventId: { type: string, format: uuid }
        friends:
          {
            type: array,
            maxItems: 4,
            items: { $ref: '#/components/schemas/EventPurchaseFriend' },
          }
    UpdateServiceChargePayload:
      type: object
      additionalProperties: false
      required:
        - amount
      properties:
        amount:
          type: number
          format: decimal
          minimum: 0
          exclusiveMinimum: true
          maximum: 99999999.99
          multipleOf: 0.01
          description: Fixed global Service Charge amount. Must be greater than 0.00 and have no more than two decimal places.
          example: 5.5
    ServiceCharge:
      type: object
      required:
        - id
        - amount
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          enum: [GLOBAL]
          description: The fixed singleton identifier for the global configuration.
        amount:
          type: number
          format: decimal
          minimum: 0
          exclusiveMinimum: true
          multipleOf: 0.01
          description: Fixed global Service Charge amount. No currency is stored with this configuration.
          example: 5.5
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CheckAccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: User is authenticated
        traceId:
          type: string
          format: uuid
        data:
          type: object
          properties:
            name:
              type: string
              example: John Doe
            avatar:
              type: string
              nullable: true
              example: https://example.com/avatar.jpg
            role:
              type: string
              example: USER
            accountStatus:
              type: string
              example: ACTIVE
      required:
        - success
        - message
        - traceId
    FindRecoverUserByEmailPayload:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          example: user@example.com
    VerifyRecoverUserOtpPayload:
      type: object
      required:
        - otp
      properties:
        otp:
          type: string
          example: '123456'
          description: 6-digit numeric OTP
    ResetRecoverUserPasswordPayload:
      type: object
      required:
        - password
      properties:
        password:
          type: string
          example: newStrongPassword123!
          description: Minimum 6 characters
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
        traceId:
          type: string
          format: uuid
      required:
        - success
        - message
        - traceId
    TokenResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                token:
                  type: string
              required:
                - token
    MediaResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data:
              type: array
              items:
                type: string
                format: uri
              description: Array of S3 URLs for uploaded files
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: ok
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Server Is Running
        dependencies:
          type: object
          properties:
            database:
              type: string
              example: up
            redis:
              type: string
              example: up
        traceId:
          type: string
          format: uuid
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
        traceId:
          type: string
          format: uuid
      required:
        - success
        - message
        - traceId
    AuthErrorResponse:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          properties:
            errorType:
              type: string
              enum:
                - TOKEN_EXPIRED
                - TOKEN_INVALID
                - TOKEN_BLACKLISTED
                - USER_BLOCKED
                - INVALID_CREDENTIALS
                - DUPLICATE_DATA
                - OTP_EXPIRED
                - INVALID_OTP
                - ACCESS_DENIED
                - USER_NOT_FOUND
                - INVALID_DEVICE_CONTEXT
    ValidationErrorResponse:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          properties:
            errors:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                  message:
                    type: string
    SignupPayload:
      type: object
      required:
        - role
        - name
        - email
        - phoneNumber
        - location
        - password
        - deviceIdentifier
        - lat
        - lng
        - platform
      properties:
        role:
          type: string
          enum:
            - CLUB_OWNER
            - USER
        name:
          type: string
          minLength: 1
        email:
          type: string
          format: email
        phoneNumber:
          type: string
          minLength: 5
        location:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 6
        deviceIdentifier:
          type: string
          minLength: 1
        fcmToken:
          type: string
        lat:
          type: number
        lng:
          type: number
        platform:
          type: string
          enum:
            - ANDROID
            - IOS
        gender:
          type: string
          enum:
            - MALE
            - FEMALE
            - OTHER
        dateOfBirth:
          type: string
          format: date-time
    LoginPayload:
      type: object
      required:
        - email
        - password
        - deviceIdentifier
        - platform
        - lat
        - lng
      properties:
        email:
          type: string
          format: email
          example: xopoxe8124@hebase.com
        password:
          type: string
          minLength: 6
          example: 12345678aA
        deviceIdentifier:
          type: string
          minLength: 1
          example: zZp|6sBQ<Ca2_=Kl]J7jt:Mvz{n9VT$v
        platform:
          type: string
          enum:
            - ANDROID
            - IOS
          example: ANDROID
        fcmToken:
          type: string
          example: fcm_token_sample_abc123_def456_ghi789_jkl012_mno345_pqr678_stu901_vwx234_yz5678_ABCDEF_GHIJKL_MNOPQR_STUVWX_YZ
        rememberMe:
          type: boolean
          default: false
          example: true
        lng:
          type: number
          format: double
          example: -71.935353
        lat:
          type: number
          format: double
          example: -15.315821
    OAuthLoginPayload:
      type: object
      required:
        - email
        - deviceIdentifier
        - platform
        - provider
        - lat
        - lng
      properties:
        email:
          type: string
          format: email
          example: john.doe@example.com
        deviceIdentifier:
          type: string
          minLength: 1
          example: zZp|6sBQ<Ca2_=Kl]J7jt:Mvz{n9VT$v
        platform:
          type: string
          enum:
            - ANDROID
            - IOS
          example: ANDROID
        provider:
          type: string
          enum:
            - GOOGLE
            - APPLE
          example: GOOGLE
        fcmToken:
          type: string
          example: fcm_token_sample
        lat:
          type: number
          format: double
          example: -15.315821
        lng:
          type: number
          format: double
          example: -71.935353
    LoginResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Login successful
        data:
          type: object
          properties:
            token:
              type: string
              example: eyJhbGci...
            role:
              type: string
              example: USER
            isUserVerified:
              type: boolean
              example: true
        traceId:
          type: string
          example: 1234567890
    VerifySignupPayload:
      type: object
      required:
        - otp
        - deviceIdentifier
        - platform
      properties:
        otp:
          type: string
          minLength: 6
          maxLength: 6
          pattern: ^\d+$
        deviceIdentifier:
          type: string
          minLength: 1
        fcmToken:
          type: string
        platform:
