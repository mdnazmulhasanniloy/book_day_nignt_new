        - name: radiusKm
          in: query
          required: false
          schema:
            type: integer
            enum:
              - 10
              - 20
              - 30
              - 40
              - 50
            default: 20
          description: Radius in km around the centre; any other value returns 422. Server default 20 when omitted (the new app sends 30 explicitly). Implemented in T-036.
        - name: cityId
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: City centre used when lat/lng are absent; any City row (launched or not). Unknown returns 404. Implemented in T-036.
      responses:
        '200':
          description: Explore feed retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      today:
                        type: array
                        items:
                          type: object
                      tomorrow:
                        type: array
                        items:
                          type: object
                      blowingUp:
                        type: array
                        items:
                          type: object
                      popularOrganizers:
                        type: array
                        items:
                          type: object
                      genres:
                        type: array
                        items:
                          type: string
                  traceId:
                    type: string
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: 'Zod validation failure from validateReq* middleware (NOTE: status is 422, not 400). Message is one of: Request query validation failed. Unknown keys on `.strict` bodies also fail. Body failures include traceId and per-issue `code`; query/params failures omit traceId. (Malformed JSON body -> 400 {success,message:''Invalid JSON Payload'',traceId} from global handler.)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: |-
            - Only when an Authorization header IS sent: TOKEN_INVALID: 'Token not found' / 'Token is invalid' (missing/malformed Bearer header or bad JWT)
            - Only when an Authorization header IS sent: TOKEN_EXPIRED: 'Token has been expired'
            - Only when an Authorization header IS sent: TOKEN_BLACKLISTED: 'Token has been revoked'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Unknown cityId
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      operationId: getExploreFeed

