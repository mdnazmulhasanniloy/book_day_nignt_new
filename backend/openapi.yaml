            in: query,
            name: clubId,
            required: true,
            schema: { type: string, format: uuid },
          }
        - {
            in: query,
            name: startAt,
            required: true,
            schema: { type: string, format: date-time },
            description: Fixed CST ISO-8601 value ending in -06:00.,
          }
        - {
            in: query,
            name: endAt,
            required: true,
            schema: { type: string, format: date-time },
            description: Fixed CST ISO-8601 value ending in -06:00.,
          }
        - {
            in: query,
            name: guestCount,
            required: true,
            schema: { type: integer, minimum: 1 },
          }
      responses:
        '200':
