  /api/v1/explore:
    get:
      tags:
        - Explore
      security:
        - {}
        - bearerAuth: []
      summary: List Clubs and Events
      description: 'Returns a paginated list of public Clubs and Events. Event results returned by public Explore are always restricted to active Events with eventStatus=UPCOMING and endAt later than the current time, including when a date filter is supplied. Deactivated Clubs are excluded. Note that Club prices (minPrice, maxPrice, and currency) are derived ONLY from active packages. If an optional bearer token is provided, each item will contain an `isWishlist` boolean indicator. Search centre and radius (T-034): the centre is lat and lng when both are sent, otherwise the lat/lng of the City named by cityId (any City row, launched or not; an unknown cityId returns 404, a malformed one 422; lat/lng win when both are sent). radiusKm must be one of 10, 20, 30, 40, 50 (anything else 422); the server default is 20 km when it is omitted, so requests without radiusKm behave as before. When a centre exists every item carries distanceKm (km, 1 decimal). Day grouping and date range (T-035): dateFilter accepts this_week (Monday to Sunday of the week that contains now); from and to are inclusive ISO dates YYYY-MM-DD compared with the local start date (a bad date or from after to returns 422); group=day returns [{label, date, items}] with the fixed bucket order Today, Tomorrow, This Weekend, Upcoming (empty buckets omitted, events only: type omitted leaves clubs out, type=CLUB returns 422; paging applies to the flat chronological list first). Days are the local calendar date of the event start, computed in the zone of the City when cityId is sent, otherwise in each event Event.timezone (default UTC; nothing is inferred from city or coordinates). Order is unchanged (createdAt DESC) unless group=day, from, to or this_week is sent, then startAt ASC (sort and isPopular still override). sort=trending (T-042) ranks events by views plus Interested taps over the last 7 days. meta.total is the count of all matches ignoring page and limit. Club-only filters (isPopular, ratings, isVip) return 422 with type=EVENT. Requests without the new parameters get the old response shape.'
      parameters:
        - name: type
          in: query
          schema:
            type: string
            enum:
              - CLUB
              - EVENT
        - name: date
          in: query
          schema:
            type: string
            format: date-time
        - name: lat
          in: query
          schema:
            type: number
            minimum: -90
            maximum: 90
        - name: lng
          in: query
          schema:
            type: number
            minimum: -180
            maximum: 180
        - name: minPrice
          in: query
          schema:
            type: number
            minimum: 0
        - name: maxPrice
          in: query
          schema:
            type: number
            minimum: 0
        - name: isPopular
          in: query
          schema:
            type: boolean
            description: '''true''/''false'' string accepted (preprocessed); other values -> 422'
          description: club only
        - name: ratings
          in: query
          schema:
            type: number
            minimum: 0
            maximum: 5
          description: club only; min average rating
        - name: isVip
          in: query
          schema:
            type: boolean
            description: '''true''/''false'' string accepted (preprocessed); other values -> 422'
          description: club only
        - name: search
          in: query
          schema:
            type: string
          description: ILIKE on club name / event name
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
        - name: sort
          in: query
          schema:
            type: string
            enum:
              - newest
              - oldest
              - trending
          description: 'trending (T-042) ranks EVENTS by views + Interested taps over the last 7 UTC days, ties startAt ASC then id ASC; clubs score 0 and follow the events (ties by id). isPopular still wins over sort. Omitted, newest or oldest: unchanged. RANKING RULES (T-042, our proposal, open question for the client to confirm): windows are whole UTC days that end with the UTC day of now (today included), 7 days for trending and 30 days for most viewed. Trending score = views (EventViewDaily.views summed over the 7 days) + Interested taps (EventInterest.createdAt inside the same 7 days), weight 1 each. Most viewed score = views over the 30 days. Ties: startAt ascending, then id ascending. Until history exists (no EventViewDaily row on or before the first day of the window) the lifetime Event.viewCount replaces the windowed views (taps still count for trending). Every open counts (no per-user de-duplication). Nobody is identified: only counts are used and no endpoint shows who viewed or who is interested.'
        - name: dateFilter
          in: query
          required: false
          schema:
            type: string
            enum:
              - today
              - tomorrow
              - this_weekend
              - next_weekend
              - this_week
          description: events only. this_week (T-035) = Monday to Sunday of the current week in the zone rule described on the operation.
        - name: city
          in: query
          required: false
          schema:
            type: string
        - name: isFree
          in: query
          required: false
          schema:
            type: boolean
            description: '''true''/''false'' string accepted (preprocessed); other values -> 422'
          description: events only
        - name: genres
          in: query
          required: false
          schema:
            type: string
          description: Comma-separated, e.g. 'Techno,House'
        - name: mood
          in: query
          required: false
          schema:
            type: string
          description: Comma-separated mood chips
        - name: categoryType
          in: query
          required: false
          schema:
            type: string
            enum:
              - CLUB
              - CONCERT
              - FESTIVAL
              - OPEN_AIR
              - WAREHOUSE
          description: events only
        - name: radiusKm
          in: query
          required: false
          schema:
            type: integer
            enum:
              - 10
              - 20
              - 30
              - 40
              - 50
            default: 20
          description: 'Search radius in km around lat/lng (or around the city centre when cityId is sent). Allowed values 10, 20, 30, 40, 50; any other value returns 422. Implemented in T-034. The SERVER default when radiusKm is omitted stays 20 (the old fixed value), so live clients are unchanged. The client answered (Q6a, 2026-11-22) that the app INITIAL selection is 30 km: the new Flutter screens send radiusKm=30 explicitly, the server default is NOT 30. Without a search centre the radius has no effect.'
        - name: cityId
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: City from GET /cities; centre used when lat/lng are absent. Works without GPS permission.
        - name: group
          in: query
          required: false
          schema:
            type: string
            enum:
              - none
              - day
            default: none
          description: 'day = response data is grouped: [{label: Today|Tomorrow|This Weekend|Upcoming, date, items:[...]}] chronologically. Default keeps the flat array. Implemented in T-035: bucket rules, zone rule and the type=CLUB 422 are in the operation description. Weekend = Friday 18:00 to the end of Sunday in the zone.'
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date
          description: Start of date range (CR-10), ISO date YYYY-MM-DD, inclusive, compared with the LOCAL date of the event start (zone rule on the operation). Implemented in T-035. Must not be after to (422).
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date
          description: End of date range (CR-10), ISO date YYYY-MM-DD, inclusive. Implemented in T-035.
      responses:
        '200':
          description: Data retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  meta:
                    $ref: '#/components/schemas/ExplorePaginationMeta'
                  data:
                    description: A flat list of items, or day buckets when group=day.
                    oneOf:
                      - type: array
                        items:
                          oneOf:
                            - $ref: '#/components/schemas/ExploreClubListItem'
                            - $ref: '#/components/schemas/ExploreEventListItem'
                      - type: array
                        items:
                          $ref: '#/components/schemas/ExploreGroupedDay'
                  traceId:
                    type: string
                    format: uuid
        '401':
          description: Authentication error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Unknown cityId
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      operationId: getExploreList
