        - name: Stripe-Signature
          in: header
          required: true
          schema:
            type: string
        - name: stripe-signature
          in: header
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Event received and durably processed or deduplicated
        '500':
          description: Invalid signature or server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
