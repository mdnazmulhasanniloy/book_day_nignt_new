              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '422':
          description: Idempotency-Key header missing or >255 chars ({success,message,traceId}, no errorType) or body validation failed ({success,message:'Request body validation failed',errors:[{field,code,message}],traceId}) | guestCount cannot exceed maxGuests (N)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

  /api/v1/profile/deletion-preview:
    get:
      operationId: getProfileDeletionPreview
      tags:
        - Profile
      summary: Preview effects of account deletion
      description: 404 has no errorType.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  message:
                    type: string
                    example: Deletion preview retrieved successfully
                  data:
                    type: object
                    properties:
                      mode:
                        type: string
                        enum:
                          - SOFT_DELETE
                      canRestoreByAdmin:
                        type: boolean
                        enum:
                          - true
                      removed:
                        type: array
                        items:
                          type: object
                          properties:
                            key:
                              type: string
                            label:
                              type: string
                            count:
                              type: integer
                          required:
                            - key
                            - label
                            - count
                        description: 'keys: appAccess, sessionsAndPush, notifications, wishlists, follows, waitingLists'
                      hiddenOrDeactivated:
                        type: array
                        items:
                          type: object
                          properties:
                            key:
                              type: string
                            label:
                              type: string
                            count:
                              type: integer
                          required:
                            - key
                            - label
                            - count
                        description: 'keys: ownedClubs, ownedEvents, vipHosts'
                      retained:
                        type: array
                        items:
                          type: object
                          properties:
                            key:
                              type: string
                            label:
                              type: string
                            count:
                              type: integer
                          required:
                            - key
                            - label
                            - count
                        description: 'keys: profileIdentity, buyerOrders, sellerOrders, reviews'
                      notes:
                        type: array
                        items:
                          type: string
                    required:
                      - mode
                      - canRestoreByAdmin
                      - removed
                      - hiddenOrDeactivated
                      - retained
                      - notes
                  traceId:
                    type: string
                required:
                  - success
                  - message
                  - data
        '401':
          description: Token not found (TOKEN_INVALID); Token has been revoked (TOKEN_BLACKLISTED); Token has been expired (TOKEN_EXPIRED); Token is invalid (TOKEN_INVALID); Your account has been deleted (ACCOUNT_DELETED); Your account has been blocked (USER_BLOCKED); Your account has been deactivated (ACCOUNT_INACTIVE)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: User not found (USER_NOT_FOUND); Account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
