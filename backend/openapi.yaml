              - 10
              - 20
              - 30
              - 40
              - 50
            default: 20
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 10
      responses:
        '200':
          description: Events
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - message
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  message:
                    type: string
                  traceId:
                    type: string
                  data:
                    type: array
                    items:
