      security:
        - {}
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: host id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 120
                email:
                  type: string
                  format: email
                phone:
                  type: string
                  minLength: 1
                  maxLength: 40
                message:
                  type: string
                  minLength: 1
                  maxLength: 2000
                  description: '`Message` also accepted'
                eventId:
                  type: string
                  format: uuid
              required:
                - name
                - email
                - phone
                - message
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  message:
                    type: string
                    example: Host contact submitted successfully
