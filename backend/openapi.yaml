        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '401':
          description: Token not found/invalid/expired/revoked (errorType TOKEN_INVALID|TOKEN_EXPIRED|TOKEN_BLACKLISTED) or account DELETED/BLOCKED/INACTIVE (errorType ACCOUNT_DELETED|USER_BLOCKED|ACCOUNT_INACTIVE)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
