                application/json:
                  { schema: { $ref: '#/components/schemas/ErrorResponse' } },
              },
          }
        '422':
          {
            description: Validation error or booking interval outside club opening hours (fixed CST). Overnight opening windows are supported; starting at opening and ending at closing are allowed.,
            content:
              {
                application/json:
                  {
                    schema:
                      { $ref: '#/components/schemas/ValidationErrorResponse' },
                  },
              },
          }
  /api/v1/purchase/club:
