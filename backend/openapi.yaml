                      - eventId
                      - whatsapp
                  traceId:
                    type: string
                required:
                  - success
                  - message
                  - data
                  - traceId
        '422':
          description: '- ''Host is not assigned to this event'' (service-level)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: |-
            - Only when an Authorization header IS sent: TOKEN_INVALID: 'Token not found' / 'Token is invalid' (missing/malformed Bearer header or bad JWT)
            - Only when an Authorization header IS sent: TOKEN_EXPIRED: 'Token has been expired'
