  /api/v1/explore/filters:
    get:
      operationId: getExploreFilters
      tags:
        - Explore
      summary: Filter vocabulary for a type
      description: Single source for chips and pickers so the Events and Clubs modes show different options, and manager tags match customer filters. Lists are admin-editable. Implemented in T-037. genres and moods are the ACTIVE FilterOption rows in sortOrder (then label, then id), as the English label (FilterOption has one label column; the Italian labels are not stored, open gap). categories is the EventCategoryType list for type=EVENT and an empty list for type=CLUB (club venue attributes are not defined yet). dateShortcuts, radiusSteps and incompatibleWhenSwitching are NOT returned yet. A missing or unknown type gives 422.
      security: []
      parameters:
        - name: type
          in: query
          required: true
          schema:
            type: string
            enum:
              - CLUB
              - EVENT
      responses:
        '200':
          description: Vocabulary
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - message
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  message:
                    type: string
                  traceId:
                    type: string
                  data:
                    type: object
                    properties:
                      categories:
                        type: array
                        items:
                          type: string
                        description: 'type=EVENT: CLUB, CONCERT, FESTIVAL, OPEN_AIR, WAREHOUSE, ...; type=CLUB: venue attributes'
                      genres:
                        type: array
                        items:
                          type: string
                      moods:
                        type: array
                        items:
                          type: string
                      dateShortcuts:
                        type: array
                        items:
                          type: string
                        example:
                          - today
                          - tomorrow
                          - this_weekend
                          - this_week
                          - next_weekend
                      radiusSteps:
                        type: array
                        items:
                          type: integer
                        example:
                          - 10
                          - 20
                          - 30
                          - 40
                          - 50
                      incompatibleWhenSwitching:
                        type: array
                        items:
                          type: string
                        description: Filter keys the client must clear when switching to this type
        '422':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

  /api/v1/explore/map:
    get:
      operationId: getExploreMap
      tags:
        - Explore
      summary: Map pins with the same filters as /explore
      description: 'Implemented in T-038. Accepts the filter query parameters of GET /explore (same validation, same code builds the WHERE clauses, so list and map cannot disagree) but no page, limit, sort or group (ignored). type is required. Centre and radius follow T-034: lat+lng, else the cityId centre (unknown cityId gives 404), radiusKm 10, 20, 30, 40 or 50 (anything else 422), default 20. No pagination; at most 300 pins, nearest first when a centre exists, otherwise newest first. meta.total is the full match count and meta.truncated is true when it exceeds the pins returned. Pins carry only id, type, name, lat, lng, startAt, thumbnail, minPrice and distanceKm (only with a centre).'
      security:
        - {}
        - bearerAuth: []
      parameters:
        - name: type
          in: query
          required: true
          schema:
            type: string
            enum:
              - CLUB
              - EVENT
          description: Required.
        - name: lat
          in: query
          required: false
          schema:
            type: number
        - name: lng
          in: query
          required: false
          schema:
            type: number
        - name: radiusKm
          in: query
          required: false
          schema:
            type: integer
            enum:
              - 10
              - 20
              - 30
              - 40
              - 50
            default: 20
        - name: cityId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: genres
          in: query
          required: false
          schema:
            type: string
        - name: mood
          in: query
          required: false
          schema:
            type: string
        - name: dateFilter
          in: query
          required: false
          schema:
            type: string
            enum:
              - today
              - tomorrow
              - this_weekend
              - next_weekend
              - this_week
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: minPrice
          in: query
          required: false
          schema:
            type: number
        - name: maxPrice
          in: query
          required: false
          schema:
            type: number
        - name: isFree
          in: query
          required: false
          schema:
            type: boolean
        - name: categoryType
          in: query
          required: false
          schema:
            type: string
        - name: search
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Pins
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - message
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  message:
                    type: string
                  traceId:
                    type: string
                  meta:
                    type: object
                    required:
                      - total
                      - returned
                      - maxPins
                      - truncated
                    properties:
                      total:
                        type: integer
                      returned:
                        type: integer
                      maxPins:
                        type: integer
                        enum:
                          - 300
                      truncated:
                        type: boolean
                  data:
                    type: array
                    items:
                      type: object
                      required:
                        - id
                        - type
                        - lat
                        - lng
                        - name
                      properties:
                        id:
                          type: string
                          format: uuid
                        type:
                          type: string
                          enum:
                            - CLUB
                            - EVENT
                        name:
                          type: string
                        lat:
                          type: number
                        lng:
                          type: number
                        thumbnail:
                          type: string
                        minPrice:
                          type: number
                          description: Club cheapest active package price (null without one); event ticket price (0 is free).
                          nullable: true
                        startAt:
                          type: string
                          format: date-time
                          nullable: true
                        distanceKm:
