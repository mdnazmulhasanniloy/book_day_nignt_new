      operationId: getExploreDetail
      description: 'type=EVENT additions: interestedCount (live count of Interested taps, always present), isInterested (only with a valid bearer token), mapUrl and club (T-040, T-045; see the schema), and timezone. View tracking (T-041): opening an existing, active, non-canceled event records a best-effort view (a Redis day counter flushed by the worker into the lifetime viewCount) and, with a valid bearer token, adds the event to the caller recently viewed list (the 20 newest are kept). Tracking never delays or fails the response. Event detail does not filter by eventStatus.'

  /api/v1/explore/feed:
    get:
      tags:
        - Explore
      summary: Get Explore Feed (Customer / Mobile App)
      description: '**Target Audience: Public / Customer Mobile App.** Returns organized explore sections including today''s events, tomorrow''s events, trending events, popular organizers, and active genres for the mobile app discover/explore tab. Radius (T-036): with a centre (lat and lng both sent, else the City centre of cityId; lat/lng win; an unknown cityId returns 404, a malformed one 422) every module (today, tomorrow, blowingUp, popularOrganizers and genres) only contains events and clubs within radiusKm (10, 20, 30, 40, 50 else 422; default 20 when omitted). city (ILIKE on location) still applies on top. Without lat/lng/cityId the response is exactly as before (radiusKm alone changes nothing). The response shape is unchanged and items carry no distanceKm. 401 is returned only when an Authorization header is sent and the token is invalid; the token is not used for personalisation.'
      security:
        - {}
        - bearerAuth: []
      parameters:
        - name: city
