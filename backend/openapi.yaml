  /api/v1/bookings:
    get:
      operationId: getBookingList
      tags:
        - Bookings
      security:
        - bearerAuth: []
      summary: List user bookings
      description: 'Returns a paginated list of unified Club and Event bookings for the authenticated user, sorted by createdAt DESC. T-046: new optional bucket filter (FUTURE|PENDING|PAST) and every item gains bookingStatus (CONFIRMED | GUEST_LIST_PENDING | PAYMENT_PROCESSING | CANCELED | REFUNDED); tab is unchanged. Mapping, first match wins. Orders: (1) a Refund row exists, any Order or Refund status: REFUNDED / PAST; (2) PENDING_PAYMENT with an EXPIRED club booking or module hold: CANCELED / PAST; (3) PENDING_PAYMENT: PAYMENT_PROCESSING / PENDING; (4) PAYMENT_FAILED: CANCELED / PAST; (5) PAID and the event is CANCELED: CANCELED / PAST; (6) PAID and end <= now: CONFIRMED / PAST; (7) PAID and end > now: CONFIRMED / FUTURE. Guest-list entry (found by its userId): PENDING: GUEST_LIST_PENDING / PENDING; REJECTED: CANCELED / PAST; CONFIRMED on a CANCELED event: CANCELED / PAST; CONFIRMED with end <= now: CONFIRMED / PAST; CONFIRMED with end > now: CONFIRMED / FUTURE. End is the club booking endAt, EventPurchase.eventEndAt, or Event.endAt (module purchase and guest list), compared with the same clock as tab, so FUTURE and tab UPCOMING agree. Guest-list items have id = the entry id, orderId null (no order exists), type EVENT, eventStartAt, eventEndAt, name, lat, lng, location, thumbnail, currency and no price. Without bucket the list is the old one (PAID orders, tab rules, guest-list entries never listed) and only gains bookingStatus. page and limit that are not numeric or are 0 fall back to 1 and 10.'
      parameters:
        - name: tab
          in: query
          description: Filter bookings by tab.
          schema:
            type: string
            enum:
              - UPCOMING
              - COMPLETED
              - CANCELED
            default: UPCOMING
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            default: 10
        - name: bucket
          in: query
          required: false
          schema:
            type: string
            enum:
              - FUTURE
              - PENDING
              - PAST
          description: 'T-046. Filters by lifecycle bucket: FUTURE, PENDING (awaiting payment or guest-list approval) or PAST. With bucket the list is every order of the buyer (any status) plus the buyer guest-list entries, newest first; without it the list is unchanged.'
      responses:
        '200':
          description: Successful retrieval of bookings
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
