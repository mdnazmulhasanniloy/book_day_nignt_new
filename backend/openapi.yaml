                  - traceId
        '422':
          description: 'Zod validation failure from validateReq* middleware (NOTE: status is 422, not 400). Message is one of: Request params validation failed. Unknown keys on `.strict` bodies also fail. Body failures include traceId and per-issue `code`; query/params failures omit traceId. (Malformed JSON body -> 400 {success,message:''Invalid JSON Payload'',traceId} from global handler.)'
          content:
            application/json:
              schema:
