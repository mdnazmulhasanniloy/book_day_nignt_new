  /api/v1/owner/verify-ticket:
    post:
      summary: Verify a ticket via QR Code
      description: 'Verifies a ticket via the order ID scanned from a QR code. Returns the ticket details and marks it as checked in. Business failures return real statuses with a stable errorType (T-011): a ticket that does not exist or is not the caller order returns 404 TICKET_NOT_FOUND (the same body for both, so other sellers orders are not revealed); an order that is not PAID or is refunded returns 422 TICKET_NOT_VALID; a ticket already used returns 409 TICKET_ALREADY_USED and the body also carries usedAt (ISO time of the first check-in). 401 and 403 are not used for business failures (they come only from the auth and role middlewares).'
      tags:
        - Owner
      operationId: verifyTicket
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - orderId
              properties:
                orderId:
                  type: string
                  format: uuid
                  description: The Order ID extracted from the QR code.
      responses:
        '200':
          description: Ticket successfully verified
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      orderId:
                        type: string
                        format: uuid
                      checkedInAt:
                        type: string
                        format: date-time
                      status:
                        type: string
                      buyerName:
                        type: string
                      serviceType:
                        type: string
                      details:
                        type: object
                        description: Contains ClubBooking or EventPurchase details depending on serviceType
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Body validation failed, or TICKET_NOT_VALID (order not PAID, or refunded)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '409':
          description: TICKET_ALREADY_USED; the body includes usedAt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

