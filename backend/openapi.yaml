  /api/v1/explore/most-viewed:
    get:
      operationId: getExploreMostViewed
      tags:
        - Explore
      summary: Most viewed events in a city
      description: 'City-wide ranking of events over the last 30 days (Q6c), distinct from the personal recently-viewed list. T-042 implemented. Centre: lat+lng when both are sent, otherwise the City centre for cityId (any City row, whatever isLaunched; unknown id 404, malformed id 422); radiusKm is one of 10, 20, 30, 40, 50 (default 20). With neither centre there is no radius limit. Same event rows as GET /explore type=EVENT (not deactivated, not canceled, status UPCOMING, not ended). Events with no views in the window are left out. Order: views DESC, startAt ASC, id ASC. limit 1 to 20 (default 10), no paging, response has data only. Item = the GET /explore event item (distanceKm when a centre exists). RANKING RULES (T-042, our proposal, open question for the client to confirm): windows are whole UTC days that end with the UTC day of now (today included), 7 days for trending and 30 days for most viewed. Trending score = views (EventViewDaily.views summed over the 7 days) + Interested taps (EventInterest.createdAt inside the same 7 days), weight 1 each. Most viewed score = views over the 30 days. Ties: startAt ascending, then id ascending. Until history exists (no EventViewDaily row on or before the first day of the window) the lifetime Event.viewCount replaces the windowed views (taps still count for trending). Every open counts (no per-user de-duplication). Nobody is identified: only counts are used and no endpoint shows who viewed or who is interested.'
      security: []
      parameters:
        - name: cityId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: lat
          in: query
          required: false
          schema:
            type: number
        - name: lng
          in: query
          required: false
          schema:
            type: number
        - name: radiusKm
          in: query
          required: false
          schema:
            type: integer
