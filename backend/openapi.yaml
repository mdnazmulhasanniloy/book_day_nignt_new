  /api/v1/event:
    post:
      tags:
        - Event
      summary: Create a new Event
      description: 'Create a new Event. Event management is restricted to the authenticated user''s owned Events. Creates the Event, its PostGIS geog, ticketTiers (one level of children) and lineup in one transaction. Optional fields: timezone and pricingMode (T-017, rules on the fields), tierType on ticket tiers (T-016), eventDescription and tier description (an empty string is stored as null), and lineup artistId (T-044: links an existing Artist; an unknown id returns 404 Artist not found and nothing is created). W-04 (tested locally, not deployed): a lineup item WITHOUT `artistId` never modifies an existing Artist. If an Artist with the same name key (trimmed, lowercased, inner spaces collapsed) already exists, the lineup row links to it and nothing on the Artist changes (not the name, photo, links, isVerified or updatedAt). If none exists, a new Artist is created from the item and isVerified is always false, whatever `isVerified` the item says (only admins verify, through /admin/artists). Two requests that create the same new name at once end with one Artist and no error. The lineup row still stores the sent artistName, artistAvatar and links as before. Its isVerified is never taken from the request: it is always the isVerified of the linked Artist, stored on write and shown on every read (so a client-sent isVerified: true does not make an artist appear verified, and an admin verifying an artist updates every lineup that lists it). A lineup can therefore no longer change the photo or links of a shared artist: to edit it, a club owner whose event lists the artist uses PATCH /artists/{id}, or an admin does. Request and response shapes and status codes are unchanged. The response Event row includes timezone and pricingMode. A pricingMode that does not fit the price and active tiers returns 422 with errorType PRICING_MODE_INVALID. Prisma failures are mapped by the service (T-012): an unknown related record returns 404 or 409 with fixed messages; raw database text never reaches the client.'
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEventPayload'
