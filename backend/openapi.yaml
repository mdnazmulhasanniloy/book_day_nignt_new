                            - productRole
                            - can
                      missingRole:
                        type: string
                        example: ORGANIZER is not a separate role. Event organizers use CLUB_OWNER.
                    required:
                      - roles
                      - missingRole
                required:
                  - success
                  - data

  /api/v1/auth/refresh:
    post:
      operationId: postAuthRefresh
      tags:
        - Auth
      summary: Rotate refresh token
      description: Refresh tokens are single-use (stored hashed in Redis). Fails if user is unverified or accountStatus != ACTIVE.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
                  minLength: 1
              required:
                - refreshToken
              additionalProperties: false
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  message:
                    type: string
                    example: Session refreshed
                  data:
                    type: object
                    properties:
                      token:
                        type: string
                        description: New access JWT
                      refreshToken:
                        type: string
                        description: New refresh token; old one is consumed
                    required:
                      - token
                      - refreshToken
                  traceId:
                    type: string
                required:
                  - success
                  - message
                  - data
        '401':
          description: Refresh token has expired (TOKEN_EXPIRED); Refresh token is invalid (TOKEN_INVALID); Session has ended. Please log in again. (TOKEN_BLACKLISTED); Session is no longer valid (TOKEN_INVALID); Session is missing a device (INVALID_DEVICE_CONTEXT)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '422':
          description: 'Zod body validation failed (validateReqBody). NOTE: status is 422, not 400. errors[].field is the dotted path (or "body").'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
