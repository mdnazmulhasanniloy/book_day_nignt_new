              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/v1/auth/signup:
    post:
      tags:
        - Auth
      summary: User signup
      description: 'creates a new user account

        validates the submitted registration information

        creates the pending verification state

        generates the verification OTP flow

        returns the OTP-page/pending-verification token

        does not issue a normal authenticated access token until verification succeeds

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupPayload'
      responses:
        '201':
          description: Signup successful, OTP email dispatched.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '409':
          description: User already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
              example:
                success: false
                message: User with this email already exist
                errorType: USER_ALREADY_EXISTS
                traceId: 123e4567-e89b-12d3-a456-426614174000
        '422':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too many code requests from this network. Try again later. (RATE_LIMITED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /api/v1/auth/social:
    post:
      tags:
        - Auth
      summary: Social login (OAuth)
      description: |-
        Signs in with a Google or Apple identity token.
        If that provider account or token email already belongs to a user, returns that user's session.
        If no account exists, creates one and then returns the same session.
        Requires the app's deviceIdentifier, platform, and provider.
        Returns token and refreshToken. Does not return user-not-found for a new social identity.
         The request takes the provider idToken (and nonce for Apple); a new social account is always role USER and is created verified. dateOfBirth is optional and the response data carries profileComplete (false while the date of birth is missing). Retried calls with the same provider subject never create a second account. 502 PROVIDER_UNAVAILABLE when the identity provider cannot be reached, 503 PROVIDER_NOT_CONFIGURED when the provider is not configured on the server.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OAuthLoginPayload'
      responses:
        '200':
          description: Login successful. Returns access token and user role.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Identity token rejected, or the account is deleted, blocked, or inactive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
        '403':
          description: Account blocked or inactive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
        '422':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Identity provider is unavailable (PROVIDER_UNAVAILABLE)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '503':
          description: <provider> sign-in is not configured on this server (PROVIDER_NOT_CONFIGURED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /api/v1/auth/login:
    post:
      tags:
        - Auth
      summary: User login
      description: |-
        authenticates using email/password

        requires the app's deviceIdentifier

        resolves/registers the device after successful authentication

        supports multiple devices for the same account

        optionally updates FCM token information

        returns an access JWT for verified users

        uses the existing remember-me behavior

        (7-day token if rememberMe is false, 30-day token if rememberMe is true)
         The password is checked before the account status (T-021): an unknown email and a wrong password on a DELETED, BLOCKED or INACTIVE account return the same 401 INVALID_CREDENTIALS. The status message (ACCOUNT_DELETED, USER_BLOCKED, ACCOUNT_INACTIVE, still 401) is returned only after a correct password. An account with no password hash (social sign-in) answers like a wrong password.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginPayload'
      responses:
        '200':
          description: Login successful. Returns access token or OTP pending token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '422':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '500':
          description: 'Internal Service Errors (Currently thrown as native Errors caught by global 500 handler).

            Includes: "Invalid credentials", "Account is blocked or inactive".

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Invalid Credential,Check Your Email And Password (INVALID_CREDENTIALS); Your account has been deleted (ACCOUNT_DELETED); Your account has been blocked (USER_BLOCKED); Your account has been deactivated (ACCOUNT_INACTIVE)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /api/v1/auth/verify:
    post:
      tags:
        - Auth
      summary: Verify OTP
      security:
        - bearerAuth: []
      description: 'this endpoint uses the pending OTP verification token

        validates the OTP

        establishes the device relationship

        issues the normal access token after successful verification

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifySignupPayload'
      responses:
        '200':
          description: OTP Verification successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Unauthorized. OTP is invalid, expired, or token missing/revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
              example:
                success: false
                message: OTP Expired
                errorType: OTP_EXPIRED
                traceId: 123e4567-e89b-12d3-a456-426614174000
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
              example:
                success: false
                message: User not found
                errorType: USER_NOT_FOUND
                traceId: 123e4567-e89b-12d3-a456-426614174000
        '422':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/resend:
    post:
      tags:
        - Auth
      summary: Resend OTP
      security:
        - bearerAuth: []
      description: 'it requires the pending OTP verification token

        generates/sends another verification OTP

        does not issue an access token

        '
      responses:
        '200':
          description: OTP resent successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          description: Unauthorized. Token is missing, expired, or revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
              example:
                success: false
                message: Token Expired
                errorType: TOKEN_EXPIRED
                traceId: 123e4567-e89b-12d3-a456-426614174000
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
              example:
                success: false
                message: User not found
                errorType: USER_NOT_FOUND
                traceId: 123e4567-e89b-12d3-a456-426614174000
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too many code requests from this network. Try again later. (RATE_LIMITED); Please wait before requesting another code (RESEND_TOO_SOON)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /api/v1/auth/check:
    post:
      tags:
        - Auth
      summary: Check Access Token
      security:
        - bearerAuth: []
      description: |-
        it validates the access token
        validates the JWT/device relationship
        validates the submitted deviceIdentifier
        updates device activity according to the existing implementation
        does not create/reassign device ownership
         The token check runs before body validation (T-021): a missing, invalid, expired or revoked token returns 401 even when the body is invalid; with a valid token a bad body still returns 422.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckAccessPayload'
      responses:
        '200':
          description: User is authenticated and device context is valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckAccessResponse'
        '401':
          description: Unauthorized. Token missing, expired, or revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
              example:
                success: false
                message: Token Expired
                errorType: TOKEN_EXPIRED
                traceId: 123e4567-e89b-12d3-a456-426614174000
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
              example:
                success: false
                message: User not found
                errorType: USER_NOT_FOUND
                traceId: 123e4567-e89b-12d3-a456-426614174000
        '422':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '500':
          description: Invalid device context, blocked account, or other internal error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
