      description: 'Updates a promo owned by the authenticated caller. Same Bearer as POST /promo. Role and ownership (T-018): the caller must be a CLUB_OWNER or an ADMIN, any other role gets 403 with errorType ACCESS_DENIED. An eventId or clubId named on create or update must exist and belong to the caller (ADMIN: any existing one), otherwise 404 NOT_FOUND with the same body for unknown and foreign ids (not 403, because the mobile client treats 403 like 401). Update and delete: the target must be created by the caller, or sit on the caller own event or club, otherwise 404; the legacy global code (no eventId, clubId or createdByUserId) is editable and deletable by ADMIN only (404 for owners). A club owner may still create a promo with neither eventId nor clubId; it is stored with createdByUserId = the owner and only that owner (or an ADMIN) can manage it.'
      operationId: updatePromoCode
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
                discountType:
                  type: string
                  enum:
                    - PERCENTAGE
                    - FIXED_AMOUNT
                discountValue:
                  type: number
                eventId:
                  type: string
                  format: uuid
                  nullable: true
                clubId:
                  type: string
                  format: uuid
                  nullable: true
                maxUses:
                  type: integer
                  nullable: true
                expiresAt:
                  type: string
                  format: date-time
                  nullable: true
                isActive:
                  type: boolean
      responses:
        '200':
          description: Promo code updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/PromoCode'
                  traceId:
                    type: string
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Promo not found, not accessible to the caller, or unknown eventId/clubId (errorType NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Renamed promo code already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '403':
          description: Caller is not a club owner or admin (errorType ACCESS_DENIED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
    delete:
      tags:
        - Promo
      summary: Delete promo code
      description: 'Hard-deletes a promo owned by the authenticated caller. Same Bearer as POST /promo. Role and ownership (T-018): the caller must be a CLUB_OWNER or an ADMIN, any other role gets 403 with errorType ACCESS_DENIED. An eventId or clubId named on create or update must exist and belong to the caller (ADMIN: any existing one), otherwise 404 NOT_FOUND with the same body for unknown and foreign ids (not 403, because the mobile client treats 403 like 401). Update and delete: the target must be created by the caller, or sit on the caller own event or club, otherwise 404; the legacy global code (no eventId, clubId or createdByUserId) is editable and deletable by ADMIN only (404 for owners). A club owner may still create a promo with neither eventId nor clubId; it is stored with createdByUserId = the owner and only that owner (or an ADMIN) can manage it.'
      operationId: deletePromoCode
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Promo code deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    nullable: true
                  traceId:
                    type: string
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Promo code not found or not owned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '403':
          description: Caller is not a club owner or admin (errorType ACCESS_DENIED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /api/v1/purchase/club/availability:
