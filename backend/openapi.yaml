            notifiedAt:
              type: string
              format: date-time
              nullable: true
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
            club:
              type: object
              properties:
                id:
                  type: string
                name:
                  type: string
    ApiErrorResponse:
      type: object
      required:
        - success
        - message
      properties:
        success:
          type: boolean
          enum:
            - false
        message:
          type: string
        errorType:
          type: string
          description: AuthErrorType value (server/src/const.ts), when thrown
        traceId:
          type: string
          description: Absent on some responses (see operation notes)
        errors:
          type: array
          description: Present only on 422 validation errors
          items:
            type: object
            properties:
              field:
                type: string
              code:
                type: string
              message:
                type: string
        usedAt:
          type: string
          format: date-time
          description: 'Only on 409 TICKET_ALREADY_USED from POST /owner/verify-ticket: ISO time of the first check-in.'
      description: Error body used by the operations added or revised in the 2026-11 sync. Unlike ErrorResponse, traceId is not guaranteed (query and params validation failures omit it) and errorType and errors[] may be present. 422 validation failures use status 422, not 400.
    PageMeta:
      type: object
      required:
        - page
        - limit
        - total
        - totalPages
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer
    ExploreGroupedDay:
      type: object
      required:
        - label
        - date
        - items
      description: One bucket of GET /explore?group=day. Buckets are in the fixed order Today, Tomorrow, This Weekend, Upcoming; empty buckets are omitted.
      properties:
        label:
          type: string
          enum:
            - Today
            - Tomorrow
            - This Weekend
            - Upcoming
        date:
          type: string
          format: date
          description: Local date (YYYY-MM-DD) of the first item of the bucket.
        items:
          type: array
          items:
            $ref: '#/components/schemas/ExploreEventListItem'
    ExploreEventClubIdentity:
      type: object
      nullable: true
      description: Identity of the club the event is linked to through Event.clubId; null when the event has no club or that club is deactivated.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        thumbnail:
          type: string
        location:
          type: string
        followerCount:
          type: integer
    City:
      type: object
      required:
        - id
        - name
        - lat
        - lng
        - isLaunched
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        countryCode:
          type: string
          description: ISO 3166-1 alpha-2
        lat:
          type: number
        lng:
          type: number
        timezone:
          type: string
          description: IANA zone
        isLaunched:
          type: boolean
          description: false = city is known but not live; clients show a "coming soon" state
    ArtistSocialLinks:
      type: object
      description: OUR PROPOSAL (T-044), to be confirmed by the client. Only these keys are accepted, unknown keys are rejected (422). Each value is an https URL of at most 2048 characters. Spotify has its own column (spotifyUrl) and the photo is `photo`.
      additionalProperties: false
      properties:
        instagram:
          type: string
          format: uri
          maxLength: 2048
        facebook:
          type: string
          format: uri
          maxLength: 2048
        x:
          type: string
          format: uri
          maxLength: 2048
        tiktok:
          type: string
          format: uri
          maxLength: 2048
        youtube:
          type: string
          format: uri
          maxLength: 2048
        soundcloud:
          type: string
          format: uri
          maxLength: 2048
        website:
          type: string
          format: uri
          maxLength: 2048
    ArtistProfile:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        photo:
          type: string
          description: Artist.avatar
          nullable: true
        bio:
          type: string
          nullable: true
        socialLinks:
          oneOf:
            - $ref: '#/components/schemas/ArtistSocialLinks'
            - type: 'null'
        spotifyUrl:
          type: string
          nullable: true
        soundcloudUrl:
          type: string
          nullable: true
        audioPreviewUrl:
          type: string
          nullable: true
        isVerified:
          type: boolean
        followerCount:
          type: integer
        isFollowing:
          type: boolean
          description: only with a valid bearer token, and only about that user
        upcomingEventCount:
          type: integer
          description: only on GET /artists items
        upcomingEvents:
          type: array
          description: only on GET /artists/{id} and PATCH /artists/{id}, at most 20, soonest first
          items:
            type: object
            additionalProperties: true
            description: same item shape as GET /explore type=EVENT plus startAt
    ArtistUpdate:
      type: object
      description: At least one field. Unknown keys are rejected (422). Owner PATCH accepts photo, bio, spotifyUrl and socialLinks only; the admin PATCH also accepts name and isVerified.
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
          description: admin only
        photo:
          type: string
          format: uri
          maxLength: 2048
          description: https URL, stored in Artist.avatar
          nullable: true
        bio:
          type: string
          maxLength: 2000
          description: trimmed, an empty string is stored as null
          nullable: true
        spotifyUrl:
          type: string
          format: uri
          maxLength: 2048
          description: https URL
          nullable: true
        socialLinks:
          oneOf:
            - $ref: '#/components/schemas/ArtistSocialLinks'
            - type: 'null'
          description: replaces the whole stored object, null clears it
        isVerified:
          type: boolean
          description: admin only
paths:
  /api/v1/owner/dashboard:
    get:
      summary: Retrieve Club Owner Dashboard statistics
      description: Retrieves global lifetime statistics, this month's earnings, and the 2 most recent bookings across all active Clubs and Events owned by the authenticated owner.
      tags:
        - Owner
      operationId: getOwnerDashboard
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Dashboard stats retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      totalClubBookings:
                        type: integer
                      totalEventTicketsSold:
                        type: integer
                      totalEarnings:
                        type: number
                      thisMonthEarnings:
                        type: number
                      recentBookings:
                        type: array
                        items:
                          oneOf:
                            - $ref: '#/components/schemas/ExploreClubListItem'
                            - $ref: '#/components/schemas/ExploreEventListItem'
                  traceId:
                    type: string
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden (Not a Club Owner or Connect not ready)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/owner/earnings:
    get:
      summary: Retrieve Club Owner Earnings
      description: Retrieves today's overview and monthly earnings for the authenticated Club Owner.
      tags:
        - Owner
      operationId: getOwnerEarnings
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: year
          schema:
            type: integer
            minimum: 2000
            maximum: 2100
          required: false
          description: Calendar year for monthly earnings. Defaults to the current fixed-CST calendar year.
      responses:
        '200':
          description: Earnings retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      todayOverview:
                        type: object
                        properties:
                          last7DaysRevenue:
                            type: number
                          todayRevenue:
                            type: number
                          todayTotalClubBookings:
                            type: integer
                          todayTotalEventTicketsSold:
                            type: integer
                      monthlyEarning:
                        type: object
                        properties:
                          selectedYear:
                            type: integer
                          data:
                            type: array
                            items:
                              type: object
                              properties:
                                month:
                                  type: integer
                                amount:
                                  type: number
                          availableYears:
                            type: array
                            items:
                              type: integer
                  traceId:
                    type: string
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden (Not a Club Owner or Connect not ready)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/owner/payments:
    get:
      summary: Retrieve Club Owner Payments
      description: Retrieves a paginated list of paid customer orders (earnings) for the authenticated Club Owner's clubs and events.
      tags:
        - Owner
      operationId: getOwnerPayments
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: type
          schema:
            type: string
            enum: [CLUB, EVENT]
          required: false
          description: Filter payments by service type.
        - in: query
          name: clubId
          schema:
            type: string
            format: uuid
          required: false
          description: Filter payments by a specific Club ID. Requires type=CLUB.
        - in: query
          name: eventId
          schema:
            type: string
            format: uuid
          required: false
          description: Filter payments by a specific Event ID. Requires type=EVENT.
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
          required: false
          description: Page number for pagination.
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
          required: false
          description: Number of items per page.
      responses:
        '200':
          description: Payments retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  meta:
                    type: object
                    properties:
                      page:
                        type: integer
                      limit:
                        type: integer
                      total:
                        type: integer
                      totalPages:
                        type: integer
                      links:
                        type: object
                        properties:
                          first:
                            type: string
                          previous:
                            type: string
                            nullable: true
                          next:
                            type: string
                            nullable: true
                          last:
                            type: string
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        type:
                          type: string
                          enum: [CLUB, EVENT]
                        clubId:
                          type: string
                          format: uuid
                        clubName:
                          type: string
                          description: Present when type=CLUB
                        club:
                          type: object
                          description: Present when type=CLUB
                          properties:
                            id:
                              type: string
                              format: uuid
                            name:
                              type: string
                        eventId:
                          type: string
                          format: uuid
                        eventName:
                          type: string
                          description: Present when type=EVENT (ticket or VIP module)
                        event:
                          type: object
                          description: Present when type=EVENT
                          properties:
                            id:
                              type: string
                              format: uuid
                            name:
                              type: string
                        title:
                          type: string
                          description: Sale label (club name, event name, or VIP module name)
                        customerName:
                          type: string
                        createdAt:
                          type: string
                          format: date-time
                        amount:
                          type: number
                  traceId:
                    type: string
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden (Not a Club Owner or Connect not ready)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/reviews/{clubId}:
    get:
      summary: Retrieve reviews for a Club
      description: Retrieve a paginated list of public reviews for a specific Club. Ordered by newest first.
      tags:
        - Reviews
      operationId: getClubReviews
      parameters:
        - name: clubId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          description: Page number
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          description: Number of items per page
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
      responses:
        '200':
          description: Data retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  meta:
                    type: object
                    properties:
                      total:
                        type: integer
                      totalPages:
                        type: integer
                      links:
                        type: object
                        properties:
                          currentPage:
                            type: string
                          nextPage:
                            type: string
                            nullable: true
                          previousPage:
                            type: string
                            nullable: true
                          firstPage:
                            type: string
                          lastPage:
                            type: string
                  data:
                    type: object
                    properties:
                      averageRating:
                        type: number
                      reviews:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              format: uuid
                            rating:
                              type: number
                            review:
                              type: string
                              nullable: true
                            createdAt:
                              type: string
                              format: date-time
                            reviewer:
                              type: object
                              properties:
                                name:
                                  type: string
                                avatar:
                                  type: string
                                  nullable: true
                  traceId:
                    type: string
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Unprocessable Entity (Validation failed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
  /api/v1/reviews:
    post:
      summary: Create a Club review
      description: Create a review for a Club. User must have at least one paid and completed booking for the club.
      tags:
        - Reviews
      operationId: createClubReview
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - clubId
                - rating
              properties:
                clubId:
                  type: string
                  format: uuid
                rating:
                  type: number
                  minimum: 1
                  maximum: 5
                review:
                  type: string
                  maxLength: 1000
      responses:
        '201':
          description: Review created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      userId:
                        type: string
                        format: uuid
                      clubId:
                        type: string
                        format: uuid
                      rating:
                        type: number
                      review:
                        type: string
                      createdAt:
                        type: string
                        format: date-time
                      updatedAt:
                        type: string
                        format: date-time
                  traceId:
                    type: string
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
        '403':
          description: Forbidden (Not eligible to review)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict (Duplicate review)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Unprocessable Entity (Validation failed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
  /api/v1/wishlist:
    post:
      tags:
        - Wishlist
      summary: Add to Wishlist
      description: >
        Adds a Club or Event to the user's wishlist.
        This operation is idempotent: repeating the same save does not create a duplicate and does not return 409.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWishlistPayload'
      responses:
        '200':
          description: Wishlist updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
        '404':
          description: Target not found or unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'

    get:
      tags:
        - Wishlist
      summary: Get Wishlist
      description: >
        Retrieves the authenticated user's wishlist.
        Mixed results are ordered by wishlist creation time descending.
        Unavailable or stale saved items (deactivated Clubs, non-UPCOMING Events) are automatically excluded.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: type
          schema:
            type: string
            enum:
              - CLUB
              - EVENT
          required: false
          description: Filter wishlist items by type.
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
          required: false
          description: Page number.
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
          required: false
          description: Number of items per page.
      responses:
        '200':
          description: Wishlist retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetWishlistResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
        '422':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'

  '/api/v1/wishlist/{type}/{targetId}':
    delete:
      tags:
        - Wishlist
      summary: Remove from Wishlist
      description: >
        Removes a Club or Event from the user's wishlist.
        Deletion is scoped to the authenticated user.
        Stale wishlist records can still be removed.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: type
          required: true
          schema:
            type: string
            enum:
              - CLUB
              - EVENT
        - in: path
          name: targetId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Removed from wishlist successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
        '422':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
  /health:
    get:
      tags:
        - Health
      summary: Health check endpoint
      description:
        Reports the health status of the application and its dependencies
        (Database, Redis).
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: Service is degraded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/v1/auth/signup:
    post:
      tags:
        - Auth
      summary: User signup
      description: 'creates a new user account

        validates the submitted registration information

        creates the pending verification state

        generates the verification OTP flow

        returns the OTP-page/pending-verification token

        does not issue a normal authenticated access token until verification
        succeeds

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupPayload'
      responses:
        '201':
          description: Signup successful, OTP email dispatched.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '409':
          description: User already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
              example:
                success: false
                message: User with this email already exist
                errorType: USER_ALREADY_EXISTS
                traceId: 123e4567-e89b-12d3-a456-426614174000
        '422':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/social:
    post:
      tags:
        - Auth
      summary: Social login (OAuth)
      description: |
        Signs in with a Google or Apple identity token.
        If that provider account or token email already belongs to a user, returns that user's session.
        If no account exists, creates one and then returns the same session.
        Requires the app's deviceIdentifier, platform, and provider.
        Returns token and refreshToken. Does not return user-not-found for a new social identity.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OAuthLoginPayload'
      responses:
        '200':
          description: Login successful. Returns access token and user role.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Identity token rejected, or the account is deleted, blocked, or inactive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
        '403':
          description: Account blocked or inactive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
        '422':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/login:
    post:
      tags:
        - Auth
      summary: User login
      description: |
        authenticates using email/password

        requires the app's deviceIdentifier

        resolves/registers the device after successful authentication

        supports multiple devices for the same account

        optionally updates FCM token information

        returns an access JWT for verified users

        uses the existing remember-me behavior

        (7-day token if rememberMe is false, 30-day token if rememberMe is true)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginPayload'
      responses:
        '200':
          description: Login successful. Returns access token or OTP pending token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '422':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '500':
          description:
            'Internal Service Errors (Currently thrown as native Errors caught
            by global 500 handler).

            Includes: "Invalid credentials", "Account is blocked or inactive".

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/verify:
    post:
      tags:
        - Auth
      summary: Verify OTP
      security:
        - bearerAuth: []
      description: 'this endpoint uses the pending OTP verification token

        validates the OTP

        establishes the device relationship

        issues the normal access token after successful verification

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
