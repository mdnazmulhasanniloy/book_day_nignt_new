  /api/v1/webhooks/payment/stripe:
    post:
      tags:
        - Webhook
      summary: Stripe Payment webhook receiver
      description: No user authentication applies. Stripe sends a raw JSON body signed with Stripe-Signature. The receiver accepts payment_intent.succeeded, payment_intent.payment_failed, and payment_intent.canceled. A missing or invalid Stripe-Signature returns 400 (errorType INVALID_STRIPE_SIGNATURE). payment_intent.payment_failed releases the ticket-tier stock held by the order exactly once (T-007); PAID orders are never touched.
      operationId: processPaymentWebhook
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Raw Stripe Event JSON. The server verifies the original raw request bytes before parsing.
