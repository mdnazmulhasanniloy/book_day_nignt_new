  /api/v1/owner/bookings/export:
    get:
      operationId: getOwnerBookingsExport
      tags:
        - Owner
      summary: Export owner bookings as CSV (uploaded to S3)
      description: 'Builds a CSV in memory, uploads it to S3 key exports/bookings-{userId}-{uuid}.csv (ACL public-read, text/csv) and returns a public download URL as JSON (not a CSV stream). Only PAID orders with sellerUserId = caller, createdAt in [from,to], serviceType = type. YYYY-MM-DD bounds are UTC day start/end. CSV columns: referenceId, bookingType (TABLE|TICKET|VIP_MODULE), buyerName, buyerEmail, buyerPhone, venueName, tierOrModuleName, guestsCount, amountPaid, currency, paymentStatus, purchasedAt, checkInStatus (Checked-in|Pending), orderId, checkedInAt. Strict query (unknown params give 422). No Connect readiness check.'
      security:
        - bearerAuth: []
      parameters:
        - name: from
          in: query
          required: true
          description: YYYY-MM-DD or ISO-8601 datetime with offset
          schema:
            type: string
        - name: to
          in: query
          required: true
          description: YYYY-MM-DD or ISO-8601 datetime with offset; must be >= from
          schema:
            type: string
        - name: type
          in: query
          required: true
          schema:
            type: string
            enum:
              - CLUB
              - EVENT
        - name: clubId
          in: query
          required: false
          description: Requires type=CLUB; must belong to caller
          schema:
            type: string
            format: uuid
        - name: eventId
          in: query
          required: false
          description: Requires type=EVENT; must belong to caller
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Export ready
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - message
                  - data
                  - traceId
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                  traceId:
                    type: string
                  data:
                    type: object
                    properties:
                      downloadUrl:
                        type: string
                        format: uri
                      count:
                        type: integer
        '401':
          description: Token not found/invalid/expired/revoked (errorType TOKEN_INVALID|TOKEN_EXPIRED|TOKEN_BLACKLISTED) or account DELETED/BLOCKED/INACTIVE (errorType ACCOUNT_DELETED|USER_BLOCKED|ACCOUNT_INACTIVE)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '403':
          description: 'Access denied: Requires club owner privileges (errorType ACCESS_DENIED)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: User from token not found (errorType USER_NOT_FOUND) | Club not found | Event not found (not owned by caller)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '422':
          description: Query validation failed (bad date, from>to, invalid filter combination, unknown param)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

  /api/v1/admin/earnings:
    get:
      operationId: getAdminEarnings
      tags:
        - Admin
      summary: Admin earnings (commission) overview
      description: CSRF header required on this GET. Only PAID orders are listed. status is "Canceled" if a refund exists else "Completed". Decimal fields (price, commission, earning) are serialized as strings. page and limit must be positive integers (pattern ^[1-9][0-9]*$) and limit is at most 100, otherwise 422 with errors[] (T-010); defaults are 1 and 10.
      security:
        - adminAuth: []
          csrfAuth: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: string
            pattern: ^[1-9][0-9]*$
            default: '1'
        - name: limit
          in: query
          required: false
          schema:
            type: string
            pattern: ^[1-9][0-9]*$
            description: Positive integer, at most 100 (T-010)
            default: '10'
        - name: serviceType
          in: query
          required: false
          schema:
            type: string
            enum:
              - EVENT
              - CLUB
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  message:
                    type: string
                    example: All earnings retrieve successful for admin.
                  meta:
                    type: object
                    properties:
                      total:
                        type: integer
                      totalPages:
                        type: integer
                      links:
                        type: object
                        properties:
                          currentPage:
                            type: string
                          nextPage:
                            type: string
                            nullable: true
                          previousPage:
                            type: string
                            nullable: true
                          firstPage:
                            type: string
                          lastPage:
                            type: string
                      totalEarning:
                        description: sum commissionAmount over all PAID orders (Prisma Decimal, JSON type ⚠️ UNVERIFIED; 0 if none)
                      todayEarning:
                        description: same, since local midnight today
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        name:
                          type: string
                        createdBy:
                          type: string
                        dateAndTime:
                          type: string
                          format: date-time
                          nullable: true
                        location:
                          type: string
                        price:
                          type: string
                          description: grossAmount (Decimal)
                        commission:
                          type: string
                          description: commissionRate (Decimal)
                        earning:
                          type: string
                          description: commissionAmount (Decimal)
                        status:
                          type: string
                          enum:
                            - Canceled
                            - Completed
                            - Pending
                        currency:
                          type: string
                        serviceType:
                          type: string
                          enum:
                            - EVENT
                            - CLUB
                  traceId:
                    type: string
                required:
                  - success
                  - message
                  - meta
                  - data
        '403':
          description: 'Invalid or missing CSRF token (ACCESS_DENIED); Access denied: Requires admin privileges (ACCESS_DENIED)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Access token not found in cookies (TOKEN_INVALID); Token has been revoked (TOKEN_BLACKLISTED); Token has been expired (TOKEN_EXPIRED); Token is invalid (TOKEN_INVALID); Your admin account has been deleted (ACCOUNT_DELETED); Your admin account has been blocked (USER_BLOCKED); Your admin account has been deactivated (ACCOUNT_INACTIVE)
          content:
