        '422':
          description: Unprocessable Entity (Validation failed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '404':
          description: '- USER_NOT_FOUND: ''User not found'' (JWT valid but user row no longer exists; checkUserExistenceMiddleware)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /api/v1/wishlist:
    post:
      tags:
        - Wishlist
      summary: Add to Wishlist
      description: |-
        Adds a Club or Event to the user's wishlist. This operation is idempotent: repeating the same save does not create a duplicate and does not return 409.
         A club that is missing or deactivated, or an event that is missing, deactivated or not UPCOMING, returns 404 {success:false, message:"Club not found or unavailable" or "Event not found or unavailable", errorType:"NOT_FOUND", traceId} (T-013).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWishlistPayload'
      responses:
        '200':
          description: Wishlist updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
        '404':
          description: 'Club or event not found or unavailable (errorType NOT_FOUND); USER_NOT_FOUND: ''User not found'''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '422':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
    get:
      tags:
        - Wishlist
      summary: Get Wishlist
      description: 'Retrieves the authenticated user''s wishlist. Mixed results are ordered by wishlist creation time descending. Unavailable or stale saved items (deactivated Clubs, non-UPCOMING Events) are automatically excluded.

        '
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: type
          schema:
            type: string
            enum:
              - CLUB
              - EVENT
          required: false
          description: Filter wishlist items by type.
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
          required: false
          description: Page number.
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
          required: false
          description: Number of items per page.
      responses:
        '200':
          description: Wishlist retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetWishlistResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
        '422':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '404':
          description: '- USER_NOT_FOUND: ''User not found'' (JWT valid but user row no longer exists; checkUserExistenceMiddleware)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

  /api/v1/wishlist/{type}/{targetId}:
