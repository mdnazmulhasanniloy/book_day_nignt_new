      summary: Create Promo Code (Club Owner / Admin)
      description: '**Target Audience: Club Owner / Admin.** Allows an authorized Club Owner or Administrator to create discount promo codes for their clubs or events with percentage or fixed discount, max usage limits, and expiration date. (This API is exclusively for Club Owner and Admin portals, NOT for regular mobile app customers). Role and ownership (T-018): the caller must be a CLUB_OWNER or an ADMIN, any other role gets 403 with errorType ACCESS_DENIED. An eventId or clubId named on create or update must exist and belong to the caller (ADMIN: any existing one), otherwise 404 NOT_FOUND with the same body for unknown and foreign ids (not 403, because the mobile client treats 403 like 401). Update and delete: the target must be created by the caller, or sit on the caller own event or club, otherwise 404; the legacy global code (no eventId, clubId or createdByUserId) is editable and deletable by ADMIN only (404 for owners). A club owner may still create a promo with neither eventId nor clubId; it is stored with createdByUserId = the owner and only that owner (or an ADMIN) can manage it.'
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - code
                - discountType
                - discountValue
              properties:
                code:
                  type: string
                discountType:
                  type: string
                  enum:
                    - PERCENTAGE
                    - FIXED_AMOUNT
                discountValue:
                  type: number
                eventId:
                  type: string
                  format: uuid
                clubId:
                  type: string
                  format: uuid
                maxUses:
                  type: integer
                expiresAt:
                  type: string
                  format: date-time
      responses:
        '201':
          description: Promo code created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                  traceId:
                    type: string
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Promo code already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: 'Zod validation failure from validateReq* middleware (NOTE: status is 422, not 400). Message is one of: Request body validation failed. Unknown keys on `.strict` bodies also fail. Body failures include traceId and per-issue `code`; query/params failures omit traceId. (Malformed JSON body -> 400 {success,message:''Invalid JSON Payload'',traceId} from global handler.)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: '- USER_NOT_FOUND: ''User not found'' (JWT valid but user row no longer exists; checkUserExistenceMiddleware) | eventId/clubId unknown or not owned by the caller (errorType NOT_FOUND)'
