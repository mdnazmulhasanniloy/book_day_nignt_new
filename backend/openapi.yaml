  /api/v1/event/{id}:
    put:
      tags:
        - Event
      summary: Update an existing Event
      description: 'Updates an existing Event in-place. Event management is restricted to the authenticated user''s owned Events. All fields optional. An event that does not exist or belongs to another user returns 404 {success:false, message:"Event not found", errorType:"NOT_FOUND", traceId} (T-012; the same body for both). Ticket tiers: a tier with id updates that tier in place (soldCount and id preserved), a tier without id is created, an existing tier missing from the array is hard-deleted only when soldCount is 0 and nothing references it, otherwise it is deactivated. A capacity below soldCount returns 409 TIER_CAPACITY_BELOW_SOLD. A tier that already has sales cannot be sent with children (422 TIER_SECTION_HAS_SALES). Optional timezone (validated IANA name, 422 otherwise) and pricingMode (checked against the price and active tiers after the request is applied, 422 PRICING_MODE_INVALID, nothing changes); a request without them keeps the stored values, except that a stored pricingMode that no longer fits is re-derived. lineup items accept artistId (T-044); an unknown artistId returns 404 Artist not found and the whole update is rolled back. W-04 (tested locally, not deployed): a lineup item WITHOUT `artistId` never modifies an existing Artist. If an Artist with the same name key (trimmed, lowercased, inner spaces collapsed) already exists, the lineup row links to it and nothing on the Artist changes (not the name, photo, links, isVerified or updatedAt). If none exists, a new Artist is created from the item and isVerified is always false, whatever `isVerified` the item says (only admins verify, through /admin/artists). Two requests that create the same new name at once end with one Artist and no error. The lineup row still stores the sent artistName, artistAvatar and links as before. Its isVerified is never taken from the request: it is always the isVerified of the linked Artist, stored on write and shown on every read (so a client-sent isVerified: true does not make an artist appear verified, and an admin verifying an artist updates every lineup that lists it). A lineup can therefore no longer change the photo or links of a shared artist: to edit it, a club owner whose event lists the artist uses PATCH /artists/{id}, or an admin does. Request and response shapes and status codes are unchanged. Sending lineup replaces all lineup rows.'
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
